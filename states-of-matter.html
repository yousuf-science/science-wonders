<script>
'use strict';
// STATES OF MATTER & PHASE CHANGES
let W=560,H=400,AUXW=560,AUXH=300;
// ---- water heating curve (J/g): ice-warm, fusion, water-warm, vaporization, steam-warm ----
const EN=[42,334,418,2260,40]; const CUM=[0]; EN.forEach(x=>CUM.push(CUM[CUM.length-1]+x)); const ETOT=CUM[5];
// slider width allotted to each segment (so solid/liquid stay interactive); curve still uses real energy
const SW=[0.16,0.16,0.24,0.28,0.16]; const SWC=[0]; SW.forEach(x=>SWC.push(SWC[SWC.length-1]+x));
function heatState(Hpct){
  let f=Math.max(0,Math.min(1,Hpct/100)); let seg=0; while(seg<4 && f>SWC[seg+1]) seg++;
  const u=Math.max(0,Math.min(1,(f-SWC[seg])/(SW[seg]||1))); const Q=CUM[seg]+u*EN[seg];
  if(seg===0) return {T:-20+u*20, phase:'solid', melt:0, boil:0, seg, Q};
  if(seg===1) return {T:0, phase:'melting', melt:u, boil:0, seg, Q};
  if(seg===2) return {T:u*100, phase:'liquid', melt:1, boil:0, seg, Q};
  if(seg===3) return {T:100, phase:'boiling', melt:1, boil:u, seg, Q};
  return {T:100+u*20, phase:'gas', melt:1, boil:1, seg, Q};
}
const PHASE_NAME={solid:'❄️ Solid (ice)',melting:'💧 Melting',liquid:'💧 Liquid (water)',boiling:'♨️ Boiling',gas:'💨 Gas (steam)'};

const S={mode:'lab', H:8, auto:0, mols:[], pT:60, pP:0 /*log10 atm*/ };

// ---- molecular dynamics ----
const BX0=26,BY0=30,BX1=W-26,BY1=H-60; const NX=15,NY=8, N=NX*NY, MR=8, BOND=26;
function initMols(){
  S.mols=[];
  const gw=(BX1-BX0-20)/(NX-1), gh=18;
  const x0=BX0+10, y0=BY1-2-(NY-1)*gh;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const hx=x0+i*gw+(j%2)*gw*0.5*0.4, hy=y0+j*gh;
    S.mols.push({x:hx,y:hy,vx:0,vy:0,hx:hx,hy:hy});
  }
}
function stepMols(dt){
  const hs=heatState(S.H); const wS=1-hs.melt, wL=hs.melt*(1-hs.boil), wG=hs.boil;
  const grav=0.05*(wS+wL);
  const thermal=0.12 + (hs.T+20)/140*(0.35+wG*3.2);
  const ks=0.03*wS;
  const damp=0.86+wG*0.12;
  const m=S.mols;
  for(let i=0;i<N;i++){ m[i].fx=0; m[i].fy=0; }
  for(let i=0;i<N;i++){ const a=m[i];
    for(let j=i+1;j<N;j++){ const b=m[j]; let dx=b.x-a.x, dy=b.y-a.y; const d2=dx*dx+dy*dy;
      if(d2>BOND*BOND||d2<0.01)continue; const d=Math.sqrt(d2); const nx=dx/d, ny=dy/d;
      if(d<MR*1.8){ const push=(MR*1.8-d)*0.06; a.fx-=nx*push; a.fy-=ny*push; b.fx+=nx*push; b.fy+=ny*push; }
      else { const att=(wL*0.9+wS*0.4)*0.010*(d-MR*1.8); a.fx+=nx*att; a.fy+=ny*att; b.fx-=nx*att; b.fy-=ny*att; }
    }
  }
  for(let i=0;i<N;i++){ const p=m[i];
    p.fx+=ks*(p.hx-p.x); p.fy+=ks*(p.hy-p.y);
    p.fy+=grav;
    p.vx=(p.vx+p.fx)*damp+(Math.random()-0.5)*thermal;
    p.vy=(p.vy+p.fy)*damp+(Math.random()-0.5)*thermal;
    const sp=Math.hypot(p.vx,p.vy), mx=3.2+wG*4; if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<BX0+MR/2){p.x=BX0+MR/2;p.vx=Math.abs(p.vx)*0.7;} if(p.x>BX1-MR/2){p.x=BX1-MR/2;p.vx=-Math.abs(p.vx)*0.7;}
    if(p.y<BY0+MR/2){p.y=BY0+MR/2;p.vy=Math.abs(p.vy)*0.7;} if(p.y>BY1-MR/2){p.y=BY1-MR/2;p.vy=-Math.abs(p.vy)*0.7;}
  }
}

// ---- phase diagram helpers (water) ----
const Rv=461.5,Lv=2.26e6;
function boilT(P){ return 1/(1/373.15-(Rv/Lv)*Math.log(P))-273.15; } // °C, P in atm
function phaseAt(Tc,Patm){
  if(Tc>374&&Patm>218) return 'supercritical';
  if(Patm<0.006) return Tc< -5+(Math.log10(Patm)+2.2)*5 ? 'solid':'gas'; // rough sublimation
  if(Tc<0) return 'solid';
  return Tc<boilT(Patm)? 'liquid':'gas';
}

// ============================ RENDER ============================
let stage,sctx,aux,actx,tNow=0,lastT=0;
function cv(n){return getComputedStyle(document.body).getPropertyValue(n).trim()||'#fff';}
function clr(c,w,h){c.clearRect(0,0,w,h);c.fillStyle=cv('--stage-bg');c.fillRect(0,0,w,h);}
function drawStage(){if(!sctx)return;clr(sctx,W,H);({lab:drawLab,curve:drawCurve,diagram:drawDiagram}[S.mode])();}

function phaseTint(hs){ // molecule color by phase
  if(hs.phase==='solid'||hs.phase==='melting') return ['#bfe6ff','#7fc8ff'];
  if(hs.phase==='gas') return ['#dff0ff','#a8d4f0'];
  return ['#5fb0ff','#2a86e0'];
}
function drawLab(){
  const hs=heatState(S.H);
  // container
  const cont=sctx.createLinearGradient(0,BY0,0,BY1); cont.addColorStop(0,'rgba(120,180,255,0.04)'); cont.addColorStop(1,'rgba(120,180,255,0.10)');
  sctx.fillStyle=cont; sctx.fillRect(BX0,BY0,BX1-BX0,BY1-BY0);
  sctx.strokeStyle=cv('--border2'); sctx.lineWidth=2; sctx.beginPath(); sctx.moveTo(BX0,BY0); sctx.lineTo(BX0,BY1); sctx.lineTo(BX1,BY1); sctx.lineTo(BX1,BY0); sctx.stroke();
  // bonds
  const wBond=(1-hs.melt)*0.55+hs.melt*(1-hs.boil)*0.3;
  if(wBond>0.02){ const m=S.mols;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const dx=m[j].x-m[i].x,dy=m[j].y-m[i].y,d2=dx*dx+dy*dy; if(d2<BOND*BOND){const d=Math.sqrt(d2); sctx.strokeStyle='rgba(150,210,255,'+(wBond*(1-d/BOND))+')'; sctx.lineWidth=1.5; sctx.beginPath(); sctx.moveTo(m[i].x,m[i].y); sctx.lineTo(m[j].x,m[j].y); sctx.stroke();}}
  }
  // molecules (glossy droplets)
  const[c1,c2]=phaseTint(hs);
  for(const p of S.mols){ const g=sctx.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,MR); g.addColorStop(0,c1); g.addColorStop(1,c2);
    sctx.fillStyle=g; sctx.beginPath(); sctx.arc(p.x,p.y,MR/2+1.5,0,7); sctx.fill();
    sctx.fillStyle='rgba(255,255,255,0.5)'; sctx.beginPath(); sctx.arc(p.x-1.5,p.y-1.5,1.2,0,7); sctx.fill(); }
  // flame / ice under container based on auto
  if(S.auto>0){ for(let i=0;i<7;i++){const fx=BX0+40+i*(BX1-BX0-80)/6; const fh=14+8*Math.sin(tNow*0.02+i); const fg=sctx.createLinearGradient(0,BY1,0,BY1+fh+14); fg.addColorStop(0,'rgba(255,180,40,0.9)'); fg.addColorStop(1,'rgba(255,60,0,0)'); sctx.fillStyle=fg; sctx.beginPath(); sctx.moveTo(fx-6,BY1+16); sctx.quadraticCurveTo(fx,BY1+2-fh,fx+6,BY1+16); sctx.fill(); }
    sctx.fillStyle='#ff9d4f'; sctx.font='12px monospace'; sctx.fillText('🔥 heating',BX0,BY1+30); }
  else if(S.auto<0){ sctx.fillStyle='#7fc8ff'; sctx.font='12px monospace'; sctx.fillText('❄️ cooling',BX0,BY1+30); }
  // phase label + temp
  sctx.fillStyle=cv('--text'); sctx.font='bold 15px monospace'; sctx.textAlign='center';
  sctx.fillText(PHASE_NAME[hs.phase], W/2, 22); sctx.textAlign='left';

function drawCurve(){
  const hs=heatState(S.H); const x0=54,y0=H-56,w=W-x0-20,h=H-100;
  // axes
  sctx.strokeStyle=cv('--border2'); sctx.lineWidth=1.5; sctx.beginPath(); sctx.moveTo(x0,20); sctx.lineTo(x0,y0); sctx.lineTo(x0+w,y0); sctx.stroke();
  sctx.fillStyle=cv('--text2'); sctx.font='11px monospace'; sctx.save(); sctx.translate(16,H/2); sctx.rotate(-Math.PI/2); sctx.fillText('temperature (°C)',-40,0); sctx.restore();
  sctx.fillText('heat added  →',x0+w-90,y0+22);
  // temperature scale marks
  const Ty=t=>y0-((t+30)/160)*h;
  [0,100].forEach(t=>{sctx.strokeStyle='rgba(150,180,220,0.15)'; sctx.beginPath(); sctx.moveTo(x0,Ty(t)); sctx.lineTo(x0+w,Ty(t)); sctx.stroke(); sctx.fillStyle=cv('--text3'); sctx.fillText(t+'°',x0-26,Ty(t)+3);});
  // curve segments (x by cumulative energy)
  const Xq=q=>x0+q/ETOT*w;
  const segCol=['#7fc8ff','#8a7bff','#5fb0ff','#ff7a4f','#ff5a5a'];
  const pts=[[0,-20],[CUM[1],0],[CUM[2],0],[CUM[3],100],[CUM[4],100],[CUM[5],120]];
  for(let i=0;i<pts.length-1;i++){ sctx.strokeStyle=segCol[i]; sctx.lineWidth=3.5; sctx.beginPath(); sctx.moveTo(Xq(pts[i][0]),Ty(pts[i][1])); sctx.lineTo(Xq(pts[i+1][0]),Ty(pts[i+1][1])); sctx.stroke(); }
  // plateau labels
  sctx.font='10px monospace'; sctx.textAlign='center';
  sctx.fillStyle='#8a7bff'; sctx.fillText('melting',(Xq(CUM[1])+Xq(CUM[2]))/2,Ty(0)-8);
  sctx.fillStyle='#ff7a4f'; sctx.fillText('boiling (needs 6.8× more heat!)',(Xq(CUM[3])+Xq(CUM[4]))/2,Ty(100)-8);
  sctx.fillStyle=cv('--text3'); sctx.fillText('ice',Xq(CUM[0]/1+20),Ty(-14)); sctx.fillText('water',(Xq(CUM[2])+Xq(CUM[3]))/2,Ty(50)); sctx.fillText('steam',Xq(CUM[4])+18,Ty(112));
  sctx.textAlign='left';
  // current marker
  const mx=Xq(hs.Q),my=Ty(hs.T);
  sctx.strokeStyle='rgba(255,255,255,0.2)'; sctx.setLineDash([3,4]); sctx.beginPath(); sctx.moveTo(mx,20); sctx.lineTo(mx,y0); sctx.stroke(); sctx.setLineDash([]);
  sctx.fillStyle='#fff'; sctx.beginPath(); sctx.arc(mx,my,6,0,7); sctx.fill();
  sctx.fillStyle=cv('--gold'); sctx.beginPath(); sctx.arc(mx,my,3.5,0,7); sctx.fill();
  sctx.fillStyle=cv('--text'); sctx.font='bold 13px monospace'; sctx.textAlign='center'; sctx.fillText(PHASE_NAME[hs.phase]+'  '+hs.T.toFixed(0)+'°C',W/2,H-16); sctx.textAlign='left';
}

function drawDiagram(){
  const x0=54,y0=H-54,w=W-x0-30,h=H-90;
  const Tmin=-40,Tmax=400; const Tx=t=>x0+(t-Tmin)/(Tmax-Tmin)*w;
  const Pmin=-3,Pmax=2.6; const Py=lp=>y0-(lp-Pmin)/(Pmax-Pmin)*h; // log10 atm
  // region fills
  function region(col){sctx.fillStyle=col;}
  // sample grid fill
  for(let gx=0;gx<w;gx+=7)for(let gy=0;gy<h;gy+=7){ const T=Tmin+(gx/w)*(Tmax-Tmin); const lp=Pmin+(1-gy/h)*(Pmax-Pmin); const ph=phaseAt(T,Math.pow(10,lp));
    sctx.fillStyle= ph==='solid'?'rgba(120,190,255,0.13)':ph==='liquid'?'rgba(60,140,240,0.16)':ph==='supercritical'?'rgba(200,120,255,0.13)':'rgba(255,150,90,0.10)';
    sctx.fillRect(x0+gx,y0-h+gy,7,7); }
  // axes
  sctx.strokeStyle=cv('--border2'); sctx.lineWidth=1.5; sctx.beginPath(); sctx.moveTo(x0,y0-h); sctx.lineTo(x0,y0); sctx.lineTo(x0+w,y0); sctx.stroke();
  sctx.fillStyle=cv('--text2'); sctx.font='10px monospace'; sctx.fillText('temperature (°C) →',x0+w-120,y0+20);
  sctx.save(); sctx.translate(16,H/2); sctx.rotate(-Math.PI/2); sctx.fillText('pressure (atm, log)',-40,0); sctx.restore();
  [-3,-2,-1,0,1,2].forEach(lp=>{sctx.fillStyle=cv('--text3'); sctx.font='8px monospace'; sctx.fillText(Math.pow(10,lp)+'',x0-26,Py(lp)+3);});
  // 1 atm line
  sctx.strokeStyle='rgba(255,255,255,0.25)'; sctx.setLineDash([4,4]); sctx.beginPath(); sctx.moveTo(x0,Py(0)); sctx.lineTo(x0+w,Py(0)); sctx.stroke(); sctx.setLineDash([]);
  sctx.fillStyle=cv('--text2'); sctx.font='9px monospace'; sctx.fillText('1 atm (sea level)',x0+w-110,Py(0)-4);
  // vaporization curve
  sctx.strokeStyle='#ff7a4f'; sctx.lineWidth=2.5; sctx.beginPath(); let first=true;
  for(let lp=-2.2;lp<=Math.log10(218);lp+=0.05){ const P=Math.pow(10,lp); const T=boilT(P); const px=Tx(T),py=Py(lp); if(px>x0&&px<x0+w){first?(sctx.moveTo(px,py),first=false):sctx.lineTo(px,py);} } sctx.stroke();
  // fusion line (~0°C vertical)
  sctx.strokeStyle='#8a7bff'; sctx.beginPath(); sctx.moveTo(Tx(0),Py(Math.log10(0.006))); sctx.lineTo(Tx(-3),Py(Pmax)); sctx.stroke();
  // sublimation
  sctx.strokeStyle='#7fc8ff'; sctx.beginPath(); sctx.moveTo(Tx(0),Py(Math.log10(0.006))); sctx.lineTo(Tx(-40),Py(-3)); sctx.stroke();
  // triple & critical points
  sctx.fillStyle=cv('--gold'); sctx.beginPath(); sctx.arc(Tx(0.01),Py(Math.log10(0.006)),4,0,7); sctx.fill(); sctx.font='9px monospace'; sctx.fillText('triple point',Tx(0.01)+6,Py(Math.log10(0.006)));
  sctx.fillStyle='#c060ff'; sctx.beginPath(); sctx.arc(Tx(374),Py(Math.log10(218)),4,0,7); sctx.fill(); sctx.fillText('critical point',Tx(374)-70,Py(Math.log10(218))-6);
  // region labels
  sctx.font='bold 12px monospace';
  sctx.fillStyle='#7fc8ff'; sctx.fillText('SOLID',Tx(-25),Py(1));
  sctx.fillStyle='#5fb0ff'; sctx.fillText('LIQUID',Tx(45),Py(1.2));
  sctx.fillStyle='#ff9d4f'; sctx.fillText('GAS',Tx(230),Py(-1.5));
  // draggable marker
  const px=Tx(S.pT),py=Py(S.pP); const ph=phaseAt(S.pT,Math.pow(10,S.pP));
  sctx.strokeStyle='#fff'; sctx.lineWidth=2; sctx.beginPath(); sctx.arc(px,py,8,0,7); sctx.stroke();
  sctx.fillStyle='#fff'; sctx.beginPath(); sctx.arc(px,py,4,0,7); sctx.fill();
  sctx.fillStyle=cv('--text'); sctx.font='bold 12px monospace'; sctx.textAlign='center';
  sctx.fillText(S.pT.toFixed(0)+'°C · '+Math.pow(10,S.pP).toFixed(3)+' atm → '+ph.toUpperCase(),W/2,H-14); sctx.textAlign='left';
}

function buildTheory(){$('theory').innerHTML=`<div class="theory-hdr">Theory — States of Matter &amp; Phase Changes</div>
  <h3>The Three States</h3><p>All matter is made of particles in constant motion. What differs between a <em>solid</em>, a <em>liquid</em> and a <em>gas</em> is how much energy those particles have and how tightly they are bound. In a solid they are locked in a fixed lattice, only vibrating; in a liquid they stay close but slide past one another; in a gas they break free and fly apart to fill all available space.</p>
  <div class="hbox hb-cyan">❄️ solid = fixed shape &amp; volume &nbsp;|&nbsp; 💧 liquid = fixed volume, takes shape &nbsp;|&nbsp; 💨 gas = fills its container</div>
  <h3>Heating and Cooling</h3><p>Adding heat speeds the particles up. Cooling slows them down. Enough heating and the bonds holding a solid together break — it <em>melts</em>. Keep going and the liquid <em>boils</em> into a gas. Reverse it and gas <em>condenses</em>, liquid <em>freezes</em>. Some solids skip the liquid step entirely and <em>sublime</em> straight to gas (dry ice, or frost vanishing on a cold morning).</p>
  <h3>Latent Heat — the Hidden Energy</h3><p>Here is the surprise: while a substance changes phase, its <strong>temperature does not change</strong>. Melting ice stays at 0°C and boiling water stays at 100°C, no matter how hard you heat them. All the incoming energy goes into <em>breaking bonds</em> rather than raising temperature. This is the <strong>latent heat</strong>.</p>
  <div class="eq">Q = m · L<div class="vars">L is the latent heat. For water, melting takes 334 J/g but boiling takes 2260 J/g — 6.8× more — because boiling must rip every molecule completely free. This is why steam carries such a scalding amount of energy.</div></div>
  <h3>Pressure and the Phase Diagram</h3><p>Temperature is only half the story — <strong>pressure</strong> matters too. A phase diagram maps which state exists at each temperature and pressure. Lower the pressure and the boiling point falls: on Mount Everest, at a third of an atmosphere, water boils at about 71°C, so food cooks slowly. A pressure cooker raises the pressure to boil water at 121°C and cook faster.</p>
  <div class="hbox hb-gold">At the <b>triple point</b> (0.006 atm, 0.01°C) solid, liquid and gas coexist. Below it, liquid cannot exist at all. Above the <b>critical point</b> (218 atm, 374°C) the distinction between liquid and gas disappears entirely — a <em>supercritical fluid</em>.</p></div>
  <h3>Everyday Wonders</h3><p>Sweat cools you because evaporation carries away latent heat. Frost forms by gas turning straight to solid. Freeze-drying, cloud formation, the water cycle, even how a refrigerator works — all are phase changes governed by exactly the physics in this lab.</p>`;}

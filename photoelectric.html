<script>
'use strict';
// ============================================================================
// THE PHOTOELECTRIC EFFECT — engine
// ============================================================================
const PLANCK = 6.62607015e-34, H_eV = 4.135667696e-15, C = 2.998e8;
const E_CH = 1.602176634e-19, ME = 9.1093837e-31, HC = 1239.84;  // eV·nm

const METALS = {
  Cesium:   { phi:2.10, col:'#f0c060' },
  Sodium:   { phi:2.28, col:'#c8d0e0' },
  Calcium:  { phi:2.87, col:'#d8d8c0' },
  Zinc:     { phi:4.30, col:'#aab4c0' },
  Copper:   { phi:4.70, col:'#d88050' },
  Platinum: { phi:6.35, col:'#cfd6dd' }
};

let W=560,H=380,AUXW=560,AUXH=300;

const S = {
  mode:'experiment',
  metal:'Sodium',
  lambda:400,          // nm
  intensity:55,        // 0..100
  voltage:0.0,         // retarding potential (V); negative = accelerating
  show:{ photons:true, electrons:true, labels:true },
  classicalView:false, // classical-vs-quantum mode toggle
  points:[],           // planck mode: {f,KE}
  mystery:false, mysteryPhi:0,
  paused:false
};

// ---- physics ----
function phi(){ return S.mystery && S.mode==='planck' ? S.mysteryPhi : METALS[S.metal].phi; }
function photonE(){ return HC / S.lambda; }                 // eV
function freq(){ return C / (S.lambda*1e-9); }              // Hz
function emits(){ return photonE() > phi(); }
function keMax(){ return Math.max(0, photonE() - phi()); }  // eV
function vMax(){ return Math.sqrt(2*keMax()*E_CH/ME); }     // m/s
function vStop(){ return keMax(); }                          // volts
function thresholdLambda(){ return HC/phi(); }               // nm
function thresholdFreq(){ return phi()*E_CH/PLANCK; }             // Hz
// current (arbitrary units, ∝ intensity): saturates when accelerating, → 0 at V_stop
function current(){
  if(!emits()) return 0;
  const Isat = S.intensity/100;
  const V=S.voltage, Vs=vStop();
  if(V<=0) return Isat;
  if(V>=Vs) return 0;
  return Isat*(1 - V/Vs);
}

// ---- wavelength → colour ----
function wlColor(nm){
  let r=0,g=0,b=0;
  if(nm<380){ // UV — show as blue-violet white
    const t=Math.max(0,(nm-200)/180); r=0.5*(1-t)+0.4*t; g=0.1; b=0.9; 
    return 'rgb('+(160*(1-t)+120*t|0)+',60,'+(255)+')';
  }
  if(nm>720){ return 'rgb(90,8,8)'; } // IR deep red
  if(nm<440){ r=-(nm-440)/(440-380); g=0; b=1; }
  else if(nm<490){ r=0; g=(nm-440)/(490-440); b=1; }
  else if(nm<510){ r=0; g=1; b=-(nm-510)/(510-490); }
  else if(nm<580){ r=(nm-510)/(580-510); g=1; b=0; }
  else if(nm<645){ r=1; g=-(nm-645)/(645-580); b=0; }
  else { r=1; g=0; b=0; }
  let f=1; if(nm>700) f=0.3+0.7*(720-nm)/20; if(nm<420) f=0.3+0.7*(nm-380)/40;
  return 'rgb('+Math.round(r*255*f)+','+Math.round(g*255*f)+','+Math.round(b*255*f)+')';
}
function bandLabel(nm){ return nm<380?'ULTRAVIOLET':nm>700?'INFRARED':'VISIBLE'; }

// ---- particle systems ----
let photons=[], electrons=[], tNow=0, emitAccum=0, eAccum=0;
const EMITTER_X=165, COLLECTOR_X=430, BEAM_Y0=70, BEAM_Y1=310;

function spawnPhoton(){
  const y = BEAM_Y0 + Math.random()*(BEAM_Y1-BEAM_Y0);
  photons.push({ x:8, y, vx:3.2+Math.random()*0.6, born:tNow });
}
function spawnElectron(y){
  // assign a KE fraction of keMax (0..1), determines if it beats the retarding V
  const frac = Math.random();              // uniform KE distribution
  const ke = frac*keMax();                 // eV
  const reaches = ke > Math.max(0,S.voltage);
  electrons.push({
    x:EMITTER_X+6, y, vx:1.0+2.6*Math.sqrt(frac+0.02), ke, reaches,
    turned:false, life:0, alpha:1
  });
}

function stepParticles(dt){
  // emit photons ∝ intensity
  emitAccum += S.intensity*0.0016*dt*60;
  while(emitAccum>=1){ emitAccum-=1; if(S.show.photons) spawnPhoton(); }
  // move photons; when they hit emitter, maybe eject electron
  for(const p of photons){ p.x += p.vx*dt*60; }
  for(const p of photons){
    if(!p.done && p.x>=EMITTER_X-4){
      p.done=true; p.x=EMITTER_X-4;
      if(emits() && S.show.electrons){ if(Math.random()<0.85) spawnElectron(p.y); }
    }
  }
  photons = photons.filter(p=> p.x < EMITTER_X-3 ? true : (tNow-p.born<400 && p.x<EMITTER_X-3) ? true : !p.done ? true : false).filter(p=>p.x>-10);
  // cleaner: drop photons that reached emitter
  photons = photons.filter(p=> !(p.done));
  // move electrons under retarding field
  const Vs=vStop();
  for(const e of electrons){
    e.life += dt*60;
    // deceleration proportional to retarding voltage
    const decel = S.voltage>0 ? (S.voltage/Math.max(Vs,0.1))*0.045 : -Math.min(0.04,(-S.voltage)*0.02);
    e.vx -= decel*dt*60;
    if(e.vx<=0 && !e.turned){ e.turned=true; }
    e.x += e.vx*dt*60*2.2;
    if(e.turned){ e.x -= 0.5; e.alpha-=0.012*dt*60; }
    if(e.x>=COLLECTOR_X-6){ e.x=COLLECTOR_X-6; e.alpha-=0.06*dt*60; }
    if(e.x<EMITTER_X){ e.alpha-=0.06*dt*60; }
  }
  electrons = electrons.filter(e=> e.alpha>0 && e.life<600);
  // cap counts
  if(photons.length>400) photons.splice(0,photons.length-400);
  if(electrons.length>300) electrons.splice(0,electrons.length-300);
}

// ============================================================================
// RENDERING — apparatus
// ============================================================================
let stage,sctx,aux,actx;
function cssv(n){ return getComputedStyle(document.body).getPropertyValue(n).trim()||'#fff'; }
function clearC(ctx,w,h){ ctx.clearRect(0,0,w,h); ctx.fillStyle=cssv('--stage-bg'); ctx.fillRect(0,0,w,h); }

function drawStage(){
  if(!sctx) return;
  clearC(sctx,W,H);
  const beamCol = wlColor(S.lambda);
  const on = emits();
  // ---- evacuated tube outline ----
  sctx.strokeStyle=cssv('--border2'); sctx.lineWidth=2;
  sctx.beginPath(); sctx.roundRect(95, 40, 380, 285, 18); sctx.stroke();
  sctx.fillStyle=cssv('--text3'); sctx.font='9px monospace'; sctx.fillText('vacuum tube', 388, 55);

  // ---- light source (lamp) ----
  sctx.fillStyle=beamCol; sctx.globalAlpha=0.9; sctx.beginPath(); sctx.arc(40, (BEAM_Y0+BEAM_Y1)/2, 22,0,7); sctx.fill(); sctx.globalAlpha=1;
  sctx.strokeStyle=cssv('--border2'); sctx.lineWidth=1.5; sctx.beginPath(); sctx.arc(40,(BEAM_Y0+BEAM_Y1)/2,22,0,7); sctx.stroke();
  sctx.fillStyle=cssv('--text3'); sctx.font='9px monospace'; sctx.fillText('lamp', 28, (BEAM_Y0+BEAM_Y1)/2+40);
  // beam (gradient toward emitter), brightness ∝ intensity
  const grd=sctx.createLinearGradient(60,0,EMITTER_X,0);
  grd.addColorStop(0, beamCol); grd.addColorStop(1,'rgba(0,0,0,0)');
  sctx.globalAlpha=0.12+0.5*(S.intensity/100); sctx.fillStyle=grd;
  sctx.beginPath(); sctx.moveTo(60,(BEAM_Y0+BEAM_Y1)/2-6); sctx.lineTo(EMITTER_X,BEAM_Y0-4); sctx.lineTo(EMITTER_X,BEAM_Y1+4); sctx.lineTo(60,(BEAM_Y0+BEAM_Y1)/2+6); sctx.closePath(); sctx.fill();
  sctx.globalAlpha=1;
  // photons
  if(S.show.photons) for(const p of photons){ sctx.fillStyle=beamCol; sctx.globalAlpha=0.9; sctx.beginPath(); sctx.arc(p.x,p.y,2.6,0,7); sctx.fill(); }
  sctx.globalAlpha=1;

  // ---- emitter (cathode = metal) ----
  const mcol=METALS[S.metal] ? METALS[S.metal].col : '#ccc';
  sctx.fillStyle = S.mystery&&S.mode==='planck' ? '#7a8a9a' : mcol;
  sctx.fillRect(EMITTER_X-8, BEAM_Y0-10, 8, (BEAM_Y1-BEAM_Y0)+20);
  sctx.fillStyle=cssv('--text2'); sctx.font='9px monospace'; sctx.fillText('cathode', EMITTER_X-26, BEAM_Y1+34); sctx.fillText('(metal)', EMITTER_X-24, BEAM_Y1+44);
  // ---- collector (anode) ----
  sctx.fillStyle=cssv('--text2'); sctx.fillRect(COLLECTOR_X, BEAM_Y0-10, 8, (BEAM_Y1-BEAM_Y0)+20);
  sctx.fillText('anode', COLLECTOR_X-4, BEAM_Y1+34);

  // ---- electrons ----
  if(S.show.electrons) for(const e of electrons){
    sctx.globalAlpha=Math.max(0,e.alpha); sctx.fillStyle = e.reaches?cssv('--cyan'):cssv('--orange');
    sctx.beginPath(); sctx.arc(e.x,e.y,3,0,7); sctx.fill();
    sctx.globalAlpha=Math.max(0,e.alpha)*0.4; sctx.beginPath(); sctx.arc(e.x-e.vx*2,e.y,2,0,7); sctx.fill();
  }
  sctx.globalAlpha=1;

  // ---- "no emission" stamp ----
  if(!on){
    sctx.fillStyle=cssv('--red'); sctx.font='bold 13px monospace';
    sctx.fillText('✕ NO ELECTRONS EJECTED', EMITTER_X+24, 64);
    sctx.fillStyle=cssv('--text3'); sctx.font='10px monospace';
    sctx.fillText('photon energy '+photonE().toFixed(2)+' eV < φ '+phi().toFixed(2)+' eV', EMITTER_X+24, 80);
    sctx.fillText('brighter light will NOT help — wrong colour', EMITTER_X+24, 94);
  }

  // ---- circuit: wires, battery, ammeter ----
  const baseY=345;
  sctx.strokeStyle=cssv('--border2'); sctx.lineWidth=1.5;
  sctx.beginPath();
  sctx.moveTo(EMITTER_X-4,BEAM_Y1+22); sctx.lineTo(EMITTER_X-4,baseY); sctx.lineTo(195,baseY);
  sctx.moveTo(365,baseY); sctx.lineTo(COLLECTOR_X+4,baseY); sctx.lineTo(COLLECTOR_X+4,BEAM_Y1+22);
  sctx.stroke();
  // battery (voltage) box
  sctx.strokeStyle=cssv('--gold'); sctx.strokeRect(195,baseY-14,70,28);
  sctx.fillStyle=cssv('--gold'); sctx.font='10px monospace'; sctx.textAlign='center';
  sctx.fillText((S.voltage>=0?'+':'')+S.voltage.toFixed(2)+' V', 230, baseY+4);
  sctx.fillStyle=cssv('--text3'); sctx.font='8px monospace'; sctx.fillText(S.voltage>0?'retarding':S.voltage<0?'accelerating':'zero bias', 230, baseY-19);
  // ammeter
  const I=current();
  sctx.strokeStyle=cssv('--cyan'); sctx.beginPath(); sctx.arc(330,baseY,16,0,7); sctx.stroke();
  sctx.fillStyle=I>0.001?cssv('--cyan'):cssv('--text3'); sctx.font='bold 9px monospace';
  sctx.fillText('A', 330, baseY-20);
  // needle
  const ang=-Math.PI*0.75 + I*Math.PI*1.5;
  sctx.strokeStyle=I>0.001?cssv('--cyan'):cssv('--text3'); sctx.lineWidth=1.5;
  sctx.beginPath(); sctx.moveTo(330,baseY); sctx.lineTo(330+12*Math.cos(ang), baseY+12*Math.sin(ang)); sctx.stroke();
  sctx.textAlign='left';

  // ---- top-corner data handled by badges ----
}

  // bar 2: φ + KE stacked

  actx.strokeRect(x1, y0-P*sc, bw, P*sc);
  actx.fillStyle=cssv('--text-bright'); actx.fillText('φ = '+P.toFixed(2), x1+bw/2, y0-P*sc/2+3);
  if(KE>0){ actx.fillStyle=cssv('--green'); actx.globalAlpha=.55; actx.fillRect(x1, y0-(P+KE)*sc, bw, KE*sc); actx.globalAlpha=1; actx.strokeRect(x1, y0-(P+KE)*sc, bw, KE*sc);
    actx.fillStyle=cssv('--text-bright'); actx.fillText('KE '+KE.toFixed(2), x1+bw/2, y0-(P+KE/2)*sc+3); }
  actx.fillStyle=cssv('--text2'); actx.fillText('what it pays for', x1+bw/2, y0+14);

function drawIV(){
  const x0=46,y0=AUXH-34,w=AUXW-x0-16,h=AUXH-60;
  const Vmin=-2, Vmax=4;
  function X(v){ return x0+((v-Vmin)/(Vmax-Vmin))*w; }
  function Y(i){ return y0-i*h; }
  actx.strokeStyle=cssv('--border2'); actx.beginPath(); actx.moveTo(X(0),20); actx.lineTo(X(0),y0); actx.moveTo(x0,y0); actx.lineTo(x0+w,y0); actx.stroke();
  actx.fillStyle=cssv('--text3'); actx.font='9px monospace'; actx.fillText('current',6,28); actx.fillText('retarding V →', x0+w-78, y0+16); actx.fillText('accel ←',x0+2,y0+16);
  // curve
  const Isat=S.intensity/100, Vs=vStop(), on=emits();
  actx.strokeStyle=cssv('--cyan'); actx.lineWidth=2; actx.beginPath();
  for(let v=Vmin;v<=Vmax;v+=0.05){ let i; if(!on)i=0; else if(v<=0)i=Isat; else if(v>=Vs)i=0; else i=Isat*(1-v/Vs);
    const px=X(v),py=Y(i); v===Vmin?actx.moveTo(px,py):actx.lineTo(px,py);} actx.stroke();
  // stopping voltage marker
  if(on && Vs<=Vmax){ actx.strokeStyle=cssv('--gold'); actx.setLineDash([4,3]); actx.beginPath(); actx.moveTo(X(Vs),20); actx.lineTo(X(Vs),y0); actx.stroke(); actx.setLineDash([]);
    actx.fillStyle=cssv('--gold'); actx.fillText('V_stop='+Vs.toFixed(2)+'V', X(Vs)-30, 16); }
  // operating point
  const Inow=current(); actx.fillStyle=cssv('--pink'); actx.beginPath(); actx.arc(X(S.voltage),Y(Inow),5,0,7); actx.fill();
  actx.fillStyle=cssv('--text2'); actx.font='9px monospace'; actx.fillText('you are here', X(S.voltage)+8, Y(Inow)-6);
}

function drawPlanck(){
  const x0=50,y0=AUXH-36,w=AUXW-x0-16,h=AUXH-58;
  const fmin=0, fmax=16e14, kemax=6;
  function X(f){ return x0+(f/fmax)*w; }
  function Y(ke){ return y0-(ke/kemax)*h; }
  actx.strokeStyle=cssv('--border2'); actx.beginPath(); actx.moveTo(x0,16); actx.lineTo(x0,y0); actx.lineTo(x0+w,y0); actx.stroke();
  actx.fillStyle=cssv('--text3'); actx.font='9px monospace'; actx.fillText('KE_max (eV)',6,14); actx.fillText('frequency (×10¹⁴ Hz) →', x0+w-130, y0+16);
  for(let t=0;t<=15;t+=5){ const px=X(t*1e14); actx.fillText(t,px-4,y0+13); }
  // theory line for current metal: KE = hf/e - φ (eV)
  const P=phi();
  actx.strokeStyle=cssv('--violet'); actx.globalAlpha=.5; actx.lineWidth=1.5; actx.setLineDash([5,4]); actx.beginPath();
  let started=false;
  for(let f=fmin;f<=fmax;f+=2e13){ const ke=H_eV*f - P; if(ke<0)continue; const px=X(f),py=Y(ke); started?actx.lineTo(px,py):(actx.moveTo(px,py),started=true);} actx.stroke(); actx.setLineDash([]); actx.globalAlpha=1;
  // collected points
  actx.fillStyle=cssv('--cyan');
  S.points.forEach(p=>{ actx.beginPath(); actx.arc(X(p.f),Y(p.KE),4,0,7); actx.fill(); });
  // best-fit line through points (if ≥2) → slope=h
  if(S.points.length>=2){
    const n=S.points.length; let sx=0,sy=0,sxx=0,sxy=0;
    S.points.forEach(p=>{ sx+=p.f; sy+=p.KE; sxx+=p.f*p.f; sxy+=p.f*p.KE; });
    const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx), inter=(sy-slope*sx)/n;
    actx.strokeStyle=cssv('--gold'); actx.lineWidth=2; actx.beginPath();
    const y_at0=slope*0+inter, y_atMax=slope*fmax+inter;
    actx.moveTo(X(0),Y(y_at0)); actx.lineTo(X(fmax),Y(y_atMax)); actx.stroke();
    const hMeas=slope*E_CH; // J·s
    S._hMeas=hMeas; S._f0=(-inter/slope); S._phiMeas=-inter;
    actx.fillStyle=cssv('--gold'); actx.font='9px monospace';
    actx.fillText('slope → h ≈ '+hMeas.toExponential(2)+' J·s', x0+8, 26);
  } else { actx.fillStyle=cssv('--text3'); actx.font='9px monospace'; actx.fillText('add ≥2 points (change colour, click Record)', x0+8, 26); }
  // current photon marker
  if(emits()){ actx.strokeStyle=cssv('--pink'); actx.beginPath(); actx.arc(X(freq()),Y(keMax()),6,0,7); actx.stroke(); }
}

function drawClassical(){
  // two outcome panels: classical prediction vs quantum reality
  const colW=AUXW/2;
  actx.fillStyle=cssv('--text3'); actx.font='10px monospace';
  // divider
  actx.strokeStyle=cssv('--border2'); actx.beginPath(); actx.moveTo(colW,10); actx.lineTo(colW,AUXH-10); actx.stroke();
  actx.fillStyle=cssv('--red'); actx.font='bold 10px monospace'; actx.fillText('CLASSICAL predicts', 14, 24);
  actx.fillStyle=cssv('--green'); actx.fillText('QUANTUM (reality)', colW+14, 24);
  const on=emits();
  actx.font='10px monospace';
  // classical: brightness gives energy; below threshold should still work given time
  const cl=[
    'brighter = more KE',
    'any colour works',
    '(just wait for dim light)',
    on?'electrons ejected':'electrons ejected*'
  ];
  const qm=[
    'KE set by colour only',
    on?'this colour: YES':'this colour: NO',
    'instant, even if dim',
    on?'electrons ejected':'NONE — ever'
  ];
  cl.forEach((t,i)=>{ actx.fillStyle=i===3?(cssv('--red')):cssv('--text2'); actx.fillText('• '+t, 14, 50+i*26); });
  qm.forEach((t,i)=>{ actx.fillStyle=i===3?(on?cssv('--green'):cssv('--red')):cssv('--text'); actx.fillText('• '+t, colW+14, 50+i*26); });
  if(!on){ actx.fillStyle=cssv('--gold'); actx.font='9px monospace'; actx.fillText('*classical can\u2019t explain the threshold', 14, AUXH-12); }
}

const SCRIPT={
  experiment:"Shine light on a metal and it can knock electrons loose — the photoelectric effect. Here is the surprise: whether electrons come out depends on the colour of the light, not how bright it is. Try a red light: turn the brightness all the way up and still nothing happens. Now shift toward blue, and electrons suddenly pour out.",
  stopping:"To measure how fast the ejected electrons are moving, we push back against them with a voltage. Increase the retarding voltage until even the fastest electron is turned around and the current drops to zero. That stopping voltage tells you the maximum kinetic energy directly.",
  planck:"Plot the maximum kinetic energy of the electrons against the frequency of the light, and you get a straight line. The slope of that line is Planck\u2019s constant — one of the most fundamental numbers in all of physics. Record a few points at different colours and measure it yourself.",
  classical:"Before 1905, physics said light was purely a wave, so a brighter beam should always eject electrons, given enough time. But experiments showed a sharp colour threshold, instant emission, and energy set by colour alone. Einstein\u2019s daring fix — that light arrives in tiny packets called photons — explained it all, and launched quantum physics."
};
function speak(t){ if(!voiceOn||!t||typeof speechSynthesis==='undefined')return; const my=++sceneToken; try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{ if(my!==sceneToken||!voiceOn)return; try{const u=new SpeechSynthesisUtterance(t);u.rate=0.97;speechSynthesis.speak(u);}catch(e){} },80); }
function stopSpeech(){ sceneToken++; try{ if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel(); }catch(e){} }
function updateVoiceBtn(){ const v=$('voice-switcher'); v.textContent=voiceOn?'🔊 Voice on':'🔇 Voice off'; v.style.color=voiceOn?'var(--cyan)':''; }

function buildModeBar(){ const b=$('mode-bar'); b.innerHTML=''; MODES.forEach(m=>{ const t=el('button','mode-tab'+(m.id===S.mode?' active':''),m.label+' <span class="mode-tag">'+m.tag+'</span>'); t.onclick=()=>setMode(m.id); b.appendChild(t); }); }
function setMode(id){
  stopSpeech(); S.mode=id; if(id!=='planck')S.mystery=false;
  $('stage-title').firstChild.textContent=TITLE[id]+' '; $('stage-hint').textContent=HINT[id];
  $('aux-title').firstChild.textContent=AUXT[id]+' '; $('aux-hint').textContent=AUXH_[id];
  buildModeBar(); buildControls(); buildMetals(); buildToggles();
  // default voltage per mode
  if(id==='stopping'){ S.voltage=0; } if(id==='experiment'&&S.voltage>2){S.voltage=0;}
  updateReadout(); speak(SCRIPT[id]);
}
function buildToggleBarOnce(){ buildToggles(); }

// ============================================================================
// INTERACTIONS
// ============================================================================
function bindUI(){
  stage=$('stage'); sctx=stage.getContext('2d'); aux=$('aux'); actx=aux.getContext('2d');
  if(!sctx.roundRect){ sctx.roundRect=function(x,y,w,h,r){ this.beginPath(); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; }; }
  fitCanvases(); window.addEventListener('resize',fitCanvases);
  const ts=$('theme-switcher');
  try{ if(localStorage.getItem('theme')==='light') document.body.classList.add('light-theme'); }catch(e){}
  ts.onclick=()=>{ document.body.classList.toggle('light-theme'); try{localStorage.setItem('theme',document.body.classList.contains('light-theme')?'light':'dark');}catch(e){} };
  const vs=$('voice-switcher');
  try{ if(localStorage.getItem('pe-voice')==='on')voiceOn=true; }catch(e){}
  updateVoiceBtn();
  vs.onclick=()=>{ voiceOn=!voiceOn; try{localStorage.setItem('pe-voice',voiceOn?'on':'off');}catch(e){} updateVoiceBtn(); if(voiceOn)speak(SCRIPT[S.mode]); else stopSpeech(); };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden)stopSpeech(); });
}
function fitCanvases(){ W=560;H=380;AUXW=560;AUXH=300; stage.width=W;stage.height=H;aux.width=AUXW;aux.height=AUXH; }

// ============================================================================
// THEORY
// ============================================================================
function buildTheory(){
  $('theory').innerHTML=`
  <div class="theory-hdr">Theory — The Photoelectric Effect</div>
  <h3>The Puzzle</h3>
  <p>Shine light on a clean metal surface and electrons can be knocked out. Simple enough — until you look closely. In the early 1900s the details made no sense under the reigning theory that light is purely a wave:</p>
  <div class="hbox hb-cyan">
    1. Below a certain <strong>threshold frequency</strong>, <em>no</em> electrons come out — no matter how bright or how long you wait.<br>
    2. Above it, electrons appear <strong>instantly</strong>, even in very dim light.<br>
    3. The electrons\u2019 maximum energy depends on the light\u2019s <strong>colour (frequency)</strong>, never its brightness.<br>
    4. Brightness changes only <strong>how many</strong> electrons, not how fast.
  </div>
  <p>Wave theory predicts the opposite: a brighter wave carries more energy, so it should always work eventually, and energy should pile up over time. Reality flatly disagreed.</p>

  <h3>Einstein\u2019s Photon</h3>
  <p>In 1905 Einstein proposed that light itself is <em>lumpy</em> — it arrives in discrete packets called <strong>photons</strong>, each carrying a fixed energy set only by its frequency:</p>
  <div class="eq">E = h f = h c / λ
    <div class="vars">h = 6.626×10⁻³⁴ J·s is Planck\u2019s constant. A handy form: E(eV) = 1240 / λ(nm). One photon, one electron — an electron can only absorb a whole photon at a time, not sip energy from the wave.</div>
  </div>

  <h3>The Work Function &amp; the Energy Balance</h3>
  <p>Every metal holds its electrons with a minimum binding energy — the <em>work function</em> φ. A photon must carry at least φ to free an electron at all. Whatever energy is left over becomes the electron\u2019s kinetic energy:</p>
  <div class="eq">KE<sub>max</sub> = h f − φ
    <div class="vars">If hf &lt; φ, nothing happens (the threshold). If hf &gt; φ, the electron leaves with the surplus as motion. This single line explains every one of the four puzzles above.</div>
  </div>
  <table class="ctable">
    <tr><th>Metal</th><th>φ (eV)</th><th>Threshold λ₀</th><th>Works with…</th></tr>
    <tr><td>Cesium</td><td>2.10</td><td>590 nm</td><td>visible light</td></tr>
    <tr><td>Sodium</td><td>2.28</td><td>544 nm</td><td>green &amp; bluer</td></tr>
    <tr><td>Zinc</td><td>4.30</td><td>288 nm</td><td>ultraviolet only</td></tr>
    <tr><td>Platinum</td><td>6.35</td><td>195 nm</td><td>deep ultraviolet</td></tr>
  </table>

  <h3>Stopping Voltage</h3>
  <p>How do you measure an electron\u2019s energy? Push back on it. Make the collector negative so it repels the electrons; raise this <em>retarding voltage</em> until even the fastest electron is turned back and the current falls to zero. That stopping voltage measures the maximum kinetic energy directly:</p>
  <div class="eq">e·V<sub>stop</sub> = KE<sub>max</sub> = h f − φ
    <div class="vars">Conveniently, V_stop in volts equals KE_max in electron-volts. Brightness shifts the height of the current curve, but never the stopping voltage — proof that energy depends on colour, not intensity.</div>
  </div>

  <h3>Measuring Planck\u2019s Constant</h3>
  <p>Rearrange the equation: a graph of KE<sub>max</sub> against frequency f is a <strong>straight line</strong>. Its slope is h and its x-intercept is the threshold frequency f₀ = φ/h:</p>
  <div class="hbox hb-gold">slope = h &nbsp;·&nbsp; x-intercept = f₀ = φ/h &nbsp;·&nbsp; y-intercept = −φ</div>
  <p>Robert Millikan — who doubted Einstein and set out to <em>disprove</em> him — instead measured exactly this line in 1916, pinning down h and confirming the photon. Both men won Nobel Prizes. In the Planck\u2019s Constant mode you can record points and read h straight off the slope yourself.</p>

  <h3>Why It Changed Everything</h3>
  <p>The photoelectric effect was the first hard proof that energy at the smallest scales is <em>quantized</em> — delivered in indivisible lumps. Light, already known to behave as a wave (interference, diffraction), now also behaved as a stream of particles. This <em>wave–particle duality</em> became a cornerstone of quantum mechanics, and the same photon idea now runs solar cells, digital cameras, night-vision and light sensors everywhere.</p>
  `;
}

// ============================================================================
// LOOP + INIT
// ============================================================================
let rt=0,lastT=0;
function loop(now){
  try{
    if(!lastT)lastT=now; const dt=Math.min(2,(now-lastT)/16.67); lastT=now; tNow=now;
    if(!S.paused) stepParticles(dt);
    drawStage(); drawAux();
    if(rt++%5===0) updateReadout();
  }catch(e){ console.error('loop',e); }
  requestAnimationFrame(loop);
}
function init(){
  buildModeBar(); bindUI(); buildMetals(); buildToggles(); buildTheory();
  setMode('experiment');
  requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

</script>

<script>
'use strict';
// ============================================================================
// PROJECTILE & ORBITAL MOTION — engine
// ============================================================================
let W=560,H=400;
const G_EARTH=6.674e-11, M_EARTH=5.972e24, R_EARTH=6.371e6;

const S = {
  mode:'launch',
  v0:20, angle:45, h:0, g:9.8,    // launch params
  t:0, flying:false, trail:[],     // animation
  example:0,
  // central gravity (cannonball / orbit)
  cspeed:0.6,                       // fraction of surface orbital speed (cannonball)
  oAlt:0.6, oSpeed:1.0,             // orbit: altitude frac, speed frac of circular
  body:null, otrail:[], crashed:false, escaped:false
};

// ---- projectile physics (uniform g) ----
function vx(){ return S.v0*Math.cos(S.angle*Math.PI/180); }
function vy0(){ return S.v0*Math.sin(S.angle*Math.PI/180); }
function flightTime(){ const u=vy0(); return (u+Math.sqrt(u*u+2*S.g*Math.max(0,S.h)))/S.g; }
function range(){ return vx()*flightTime(); }
function peakAboveLaunch(){ return vy0()*vy0()/(2*S.g); }
function peakHeight(){ return S.h+peakAboveLaunch(); }
function timeToPeak(){ return vy0()/S.g; }
function posAt(t){ return { x:vx()*t, y:S.h+vy0()*t-0.5*S.g*t*t }; }
function velAt(t){ const vyy=vy0()-S.g*t; return { vx:vx(), vy:vyy, sp:Math.hypot(vx(),vyy) }; }
function impactSpeed(){ return velAt(flightTime()).sp; }

// ---- everyday worked examples ----
const EXAMPLES=[
  {emoji:'⚽',name:'Soccer free kick',v:25,angle:30,h:0,story:'A player strikes a free kick at 25 m/s, angled 30° above the grass. How far does the ball travel and how high does it climb?'},
  {emoji:'🏀',name:'Basketball shot',v:9,angle:52,h:2.0,story:'A player releases the ball at 9 m/s, 52° upward, from 2 m above the floor. Watch the high arc that drops the ball down into the hoop.'},
  {emoji:'💣',name:'Cannonball',v:80,angle:40,h:0,story:'An old cannon fires a ball at 80 m/s, 40° above level ground. Cannonballs travel surprisingly far — let us see exactly how far.'},
  {emoji:'⛲',name:'Water fountain',v:12,angle:75,h:0,story:'A fountain jet leaves the nozzle at 12 m/s, almost straight up at 75°. A steep angle trades distance for height.'},
  {emoji:'🏃',name:'Cliff jump (horizontal)',v:8,angle:0,h:20,story:'A cliff diver runs off a 20 m ledge at 8 m/s, perfectly horizontal. With no upward speed, gravity alone decides the fall time.'},
  {emoji:'🎯',name:'Javelin throw',v:29,angle:36,h:1.8,story:'An athlete launches a javelin at 29 m/s, 36°, released from shoulder height ~1.8 m. World-class throws push past 90 m.'},
  {emoji:'🏏',name:'Cricket six',v:32,angle:35,h:1.0,story:'A batter middles the ball at 32 m/s, 35°, struck about 1 m up. Will it clear the boundary rope?'},
  {emoji:'🏈',name:'Football punt',v:28,angle:55,h:0.6,story:'A punter boots the ball at 28 m/s, a high 55° to maximise hang-time so team-mates can sprint downfield.'}
];

// ---- central-gravity (cannonball / orbit) ----
const ECX=280, ECY=205, RPX=66;       // Earth on canvas
const VORB_SURF=2.55;                  // px/frame orbital speed at surface (display)
const GM = VORB_SURF*VORB_SURF*RPX;    // scaled
function vOrbAt(r){ return Math.sqrt(GM/r); }
function pxToKms(vpx){ return vpx/VORB_SURF*7.91; }   // map to real km/s

function resetBody(){
  S.crashed=false; S.escaped=false; S.otrail=[];
  if(S.mode==='cannonball'){
    // fire horizontally from a mountain just above surface
    const r=RPX+10; const x=ECX, y=ECY-r;            // top of Earth
    const v=S.cspeed*VORB_SURF;
    S.body={ x, y, vx:v, vy:0 };
  } else if(S.mode==='orbit'){
    const r=RPX+10 + S.oAlt*180;
    const vcirc=vOrbAt(r);
    S.body={ x:ECX+r, y:ECY, vx:0, vy:-vcirc*S.oSpeed };
  }
}
function stepGravity(steps){
  if(!S.body || S.crashed || S.escaped) return;
  const sub=4;
  for(let s=0;s<steps*sub;s++){
    const b=S.body;
    const dx=b.x-ECX, dy=b.y-ECY; const r2=dx*dx+dy*dy; const r=Math.sqrt(r2);
    if(r<=RPX){ S.crashed=true; b.x=ECX+dx/r*RPX; b.y=ECY+dy/r*RPX; return; }
    if(r>1400){ S.escaped=true; return; }
    const a=-GM/(r2*r);
    b.vx+=a*dx/sub; b.vy+=a*dy/sub;
    b.x+=b.vx/sub; b.y+=b.vy/sub;
  }
  S.otrail.push([S.body.x,S.body.y]); if(S.otrail.length>900) S.otrail.shift();
}

// ============================================================================
// THE LIVE WORKSHEET  (numbers plugged in, step by step)
// ============================================================================
function n(x,d){ return (Math.round(x*Math.pow(10,d==null?1:d))/Math.pow(10,d==null?1:d)); }
function wsStep(num,label,formula,sub,result,note){
  return '<div class="ws-step"><div class="ws-num">'+num+'</div><div class="ws-label">'+label+'</div>'
    +'<div class="ws-formula">'+formula+'</div>'
    +(sub?'<div class="ws-sub">= '+sub+'</div>':'')
    +(result!=null?'<div class="ws-result">→ '+result+'</div>':'')
    +(note?'<div class="ws-note">'+note+'</div>':'')+'</div>';
}
function buildWorksheet(){
  const ws=document.getElementById('worksheet'); if(!ws) return;
  if(S.mode==='cannonball'||S.mode==='orbit'){ ws.innerHTML=orbitWorksheet(); return; }
  const th=S.angle, vc=vx(), vu=vy0(), T=flightTime(), Hh=peakAboveLaunch(), Rr=range();
  let story=''; if(S.mode==='examples'){ const ex=EXAMPLES[S.example]; story='<div class="ws-story">'+ex.emoji+' '+ex.story+'</div>'; }
  let html=story;
  html+='<div class="ws-given"><b>What we know:</b><br>launch speed v₀ = '+S.v0+' m/s &nbsp; angle θ = '+th+'° &nbsp; gravity g = '+S.g+' m/s²'+(S.h>0?'<br>launch height h = '+S.h+' m':'')+'</div>';
  html+=wsStep('Step 1','Split the launch into sideways &amp; upward speed',
    'vₓ = v₀·cos θ &nbsp;&nbsp; v_y = v₀·sin θ',
    th===0? (S.v0+'·cos0 = '+n(vc)+',  '+S.v0+'·sin0 = 0') : (S.v0+'·cos'+th+'° , '+S.v0+'·sin'+th+'°'),
    'vₓ = '+n(vc,1)+' m/s,  v_y = '+n(vu,1)+' m/s',
    'Sideways speed never changes. Only the upward part feels gravity.');
  if(S.h>0){
    html+=wsStep('Step 2','Time in the air (it starts '+S.h+' m up)',
      'T = ( v_y + √(v_y² + 2gh) ) / g',
      '( '+n(vu,1)+' + √('+n(vu*vu,1)+' + '+n(2*S.g*S.h,1)+') ) / '+S.g,
      'T = '+n(T,2)+' s');
  } else {
    html+=wsStep('Step 2','Time in the air (up, then back down)',
      'T = 2·v_y / g',
      '2 × '+n(vu,1)+' / '+S.g,
      'T = '+n(T,2)+' s');
  }
  html+=wsStep('Step 3','How high it climbs (above the launch point)',
    'H = v_y² / (2g)',
    n(vu,1)+'² / (2×'+S.g+')',
    'H = '+n(Hh,2)+' m'+(S.h>0?'   (peak '+n(peakHeight(),2)+' m above ground)':''),
    'At the top the upward speed is momentarily zero.');
  html+=wsStep('Step 4','How far it travels (the range)',
    'R = vₓ · T'+(S.h===0?'  =  v₀²·sin(2θ)/g':''),
    n(vc,1)+' × '+n(T,2),
    'R = '+n(Rr,2)+' m');
  ws.innerHTML=html;
}
function orbitWorksheet(){
  const realV = S.mode==='cannonball' ? pxToKms(S.cspeed*VORB_SURF) : (()=>{ const r=RPX+10+S.oAlt*180; return pxToKms(vOrbAt(r)*S.oSpeed); })();
  const vEsc=7.91*Math.SQRT2;
  let html='<div class="ws-given"><b>Earth\u2019s numbers:</b><br>g = 9.8 m/s² &nbsp; radius R = 6 371 km &nbsp; GM = 3.99×10¹⁴</div>';
  html+=wsStep('Idea','An orbit is just falling — and missing the ground',
    'fall toward Earth, but move sideways fast enough that the ground curves away just as fast','','',
    'Newton\u2019s insight: a fast-enough cannonball never lands.');
  html+=wsStep('Orbital speed','to circle just above the surface',
    'v = √(GM / R)',
    '√(3.99×10¹⁴ / 6.37×10⁶)',
    'v ≈ 7.9 km/s   (about 28 000 km/h)');
  html+=wsStep('Escape speed','to leave Earth for good',
    'v_esc = √2 · v_orbit',
    '√2 × 7.9',
    'v_esc ≈ '+n(vEsc,1)+' km/s');
  html+=wsStep('Your launch','current speed',
    'v_now ≈ '+n(realV,2)+' km/s','',
    realV<7.7?'too slow → falls back (sub-orbital)':realV<11.1?'orbits the Earth ✓':'escapes Earth →',
    'Compare with 7.9 (circle) and 11.2 (escape).');
  return html;
}

// RENDERING
// ============================================================================
let stage,sctx;
function cssv(nm){ return getComputedStyle(document.body).getPropertyValue(nm).trim()||'#fff'; }
function clearC(){ sctx.clearRect(0,0,W,H); sctx.fillStyle=cssv('--stage-bg'); sctx.fillRect(0,0,W,H); }
let aim=null; // {angle,speed} while dragging

function drawStage(){
  if(!sctx)return; clearC();
  if(S.mode==='cannonball'||S.mode==='orbit') drawGravity();
  else drawProjectile();
}

// ---- projectile ----
function drawProjectile(){
  const T=flightTime(), Rr=range(), Hpk=peakHeight();
  const curX = S.flying? posAt(Math.min(S.t,T)).x : 0;
  const maxX=Math.max(Rr, curX, 5)*1.12, maxY=Math.max(Hpk,2)*1.25;
  const padL=42, padR=20, padT=24, groundY=H-34;
  const sc=Math.min((W-padL-padR)/maxX, (groundY-padT)/maxY);
  const oX=padL, oY=groundY;
  const X=x=>oX+x*sc, Y=y=>oY-y*sc;
  // ground
  sctx.strokeStyle=cssv('--border2'); sctx.lineWidth=1.5; sctx.beginPath(); sctx.moveTo(0,groundY); sctx.lineTo(W,groundY); sctx.stroke();
  sctx.fillStyle=cssv('--text3'); sctx.font='8px monospace';
  // distance ticks
  const stepX=niceStep(maxX,5);
  for(let d=stepX; d<maxX; d+=stepX){ sctx.globalAlpha=.5; sctx.strokeStyle=cssv('--grid-stroke'); sctx.beginPath(); sctx.moveTo(X(d),padT); sctx.lineTo(X(d),groundY); sctx.stroke(); sctx.globalAlpha=1; sctx.fillStyle=cssv('--text3'); sctx.fillText(d+'m', X(d)-7, groundY+12); }
  // height ticks
  const stepY=niceStep(maxY,3);
  for(let hh=stepY; hh<maxY; hh+=stepY){ sctx.fillStyle=cssv('--text3'); sctx.fillText(hh+'m', 4, Y(hh)+3); }
  // launch platform (height)
  if(S.h>0){ sctx.fillStyle=cssv('--border2'); sctx.fillRect(oX-10, Y(S.h), 14, oY-Y(S.h)); }
  // predicted full trajectory (dashed)
  sctx.strokeStyle=cssv('--text3'); sctx.globalAlpha=.55; sctx.setLineDash([4,4]); sctx.lineWidth=1.3; sctx.beginPath();
  for(let i=0;i<=100;i++){ const t=T*i/100; const p=posAt(t); i===0?sctx.moveTo(X(p.x),Y(p.y)):sctx.lineTo(X(p.x),Y(p.y)); }
  sctx.stroke(); sctx.setLineDash([]); sctx.globalAlpha=1;
  // max-height marker
  sctx.strokeStyle=cssv('--violet'); sctx.globalAlpha=.6; sctx.setLineDash([3,3]); sctx.beginPath(); sctx.moveTo(X(0),Y(Hpk)); sctx.lineTo(W-padR,Y(Hpk)); sctx.stroke(); sctx.setLineDash([]); sctx.globalAlpha=1;
  sctx.fillStyle=cssv('--violet'); sctx.fillText('peak '+n(Hpk,1)+' m', W-padR-70, Y(Hpk)-4);
  // range marker
  sctx.strokeStyle=cssv('--gold'); sctx.globalAlpha=.7; sctx.beginPath(); sctx.moveTo(X(Rr),groundY); sctx.lineTo(X(Rr),groundY+6); sctx.stroke(); sctx.globalAlpha=1;
  sctx.fillStyle=cssv('--gold'); sctx.fillText('range '+n(Rr,1)+' m', X(Rr)-30, groundY+22);
  // launcher
  sctx.fillStyle=cssv('--text2'); sctx.save(); sctx.translate(X(0),Y(S.h)); sctx.rotate(-S.angle*Math.PI/180); sctx.fillRect(0,-3,16,6); sctx.restore();
  // aim arrow
  if(aim){ const ax=Math.cos(aim.angle*Math.PI/180), ay=Math.sin(aim.angle*Math.PI/180); const len=aim.speed*sc*0.5;
    sctx.strokeStyle=cssv('--cyan'); sctx.lineWidth=2; sctx.beginPath(); sctx.moveTo(X(0),Y(S.h)); sctx.lineTo(X(0)+ax*len,Y(S.h)-ay*len); sctx.stroke();
    sctx.fillStyle=cssv('--cyan'); sctx.font='10px monospace'; sctx.fillText(n(aim.speed,0)+' m/s @ '+n(aim.angle,0)+'°', X(0)+ax*len+4, Y(S.h)-ay*len); }
  // flying ball + trail + vectors
  if(S.flying){ const tt=Math.min(S.t,T); const p=posAt(tt), v=velAt(tt);
    sctx.strokeStyle=cssv('--cyan'); sctx.globalAlpha=.5; sctx.lineWidth=2; sctx.beginPath();
    S.trail.forEach((q,i)=>{ i===0?sctx.moveTo(X(q.x),Y(q.y)):sctx.lineTo(X(q.x),Y(q.y)); }); sctx.stroke(); sctx.globalAlpha=1;
    // velocity components
    const bx=X(p.x), by=Y(p.y);
    if(document.getElementById('toggle-row') && S.showVec){
      arrow(bx,by,bx+v.vx*sc*0.5,by,cssv('--gold'),'vₓ');
      arrow(bx,by,bx,by-v.vy*sc*0.5,cssv('--pink'),'v_y');
      arrow(bx,by,bx+v.vx*sc*0.5,by-v.vy*sc*0.5,cssv('--cyan'),'');
    }
    sctx.fillStyle=cssv('--gold'); sctx.beginPath(); sctx.arc(bx,by,6,0,7); sctx.fill();
    sctx.strokeStyle='#fff'; sctx.lineWidth=1; sctx.stroke();
    // live time/pos badge
    sctx.fillStyle=cssv('--text2'); sctx.font='9px monospace';
    sctx.fillText('t='+n(tt,2)+'s  x='+n(p.x,1)+'m  y='+n(p.y,1)+'m', bx+10, by-8);
  } else {
    sctx.fillStyle=cssv('--gold'); sctx.beginPath(); sctx.arc(X(0),Y(S.h),6,0,7); sctx.fill();
    sctx.fillStyle=cssv('--text3'); sctx.font='9px monospace'; sctx.fillText('drag to aim, or press Launch', X(0)+12, Y(S.h)-8);
  }
}
function arrow(x1,y1,x2,y2,col,lab){ sctx.strokeStyle=col; sctx.lineWidth=2; sctx.beginPath(); sctx.moveTo(x1,y1); sctx.lineTo(x2,y2); sctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1); sctx.beginPath(); sctx.moveTo(x2,y2); sctx.lineTo(x2-7*Math.cos(a-0.4),y2-7*Math.sin(a-0.4)); sctx.lineTo(x2-7*Math.cos(a+0.4),y2-7*Math.sin(a+0.4)); sctx.closePath(); sctx.fillStyle=col; sctx.fill();
  if(lab){ sctx.fillStyle=col; sctx.font='9px monospace'; sctx.fillText(lab,(x1+x2)/2+3,(y1+y2)/2-2); } }
function niceStep(range,target){ const raw=range/target; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const r=raw/mag; const s=r<1.5?1:r<3.5?2:r<7.5?5:10; return s*mag; }

// ---- central gravity ----
function drawGravity(){
  // starfield
  sctx.fillStyle=cssv('--text3'); for(let i=0;i<40;i++){ const x=(i*137)%W, y=(i*89)%H; sctx.globalAlpha=.3; sctx.fillRect(x,y,1,1); } sctx.globalAlpha=1;
  // earth
  sctx.fillStyle=cssv('--accent'); sctx.globalAlpha=.18; sctx.beginPath(); sctx.arc(ECX,ECY,RPX+12,0,7); sctx.fill(); sctx.globalAlpha=1;
  sctx.fillStyle='#1a4a7a'; sctx.beginPath(); sctx.arc(ECX,ECY,RPX,0,7); sctx.fill();
  sctx.fillStyle='#2e7d4f'; sctx.globalAlpha=.7; sctx.beginPath(); sctx.arc(ECX-18,ECY-12,20,0,7); sctx.arc(ECX+22,ECY+18,16,0,7); sctx.fill(); sctx.globalAlpha=1;
  sctx.strokeStyle=cssv('--accent'); sctx.lineWidth=1; sctx.beginPath(); sctx.arc(ECX,ECY,RPX,0,7); sctx.stroke();
  sctx.fillStyle=cssv('--text2'); sctx.font='9px monospace'; sctx.fillText('Earth', ECX-15, ECY+3);
  // circular reference orbit (orbit mode)
  if(S.mode==='orbit'){ const r=RPX+10+S.oAlt*180; sctx.strokeStyle=cssv('--border2'); sctx.setLineDash([3,4]); sctx.globalAlpha=.5; sctx.beginPath(); sctx.arc(ECX,ECY,r,0,7); sctx.stroke(); sctx.setLineDash([]); sctx.globalAlpha=1; }
  // mountain (cannonball)
  if(S.mode==='cannonball'){ sctx.fillStyle=cssv('--text2'); sctx.beginPath(); sctx.moveTo(ECX-8,ECY-RPX); sctx.lineTo(ECX,ECY-RPX-14); sctx.lineTo(ECX+8,ECY-RPX); sctx.fill();
    sctx.fillStyle=cssv('--text3'); sctx.font='8px monospace'; sctx.fillText('cannon', ECX+12, ECY-RPX-6); }
  // trajectory trail
  if(S.otrail.length>1){ sctx.strokeStyle=cssv('--cyan'); sctx.globalAlpha=.6; sctx.lineWidth=1.6; sctx.beginPath(); S.otrail.forEach((p,i)=>{ i===0?sctx.moveTo(p[0],p[1]):sctx.lineTo(p[0],p[1]); }); sctx.stroke(); sctx.globalAlpha=1; }
  // body
  if(S.body){ sctx.fillStyle=cssv('--gold'); sctx.beginPath(); sctx.arc(S.body.x,S.body.y,5,0,7); sctx.fill();
    sctx.strokeStyle='#fff'; sctx.lineWidth=1; sctx.stroke();
    // velocity vector
    const sp=Math.hypot(S.body.vx,S.body.vy); if(sp>0){ arrow(S.body.x,S.body.y,S.body.x+S.body.vx/sp*22,S.body.y+S.body.vy/sp*22,cssv('--pink'),''); } }
  // status
  sctx.font='11px monospace';
  if(S.crashed){ sctx.fillStyle=cssv('--red'); sctx.fillText('💥 fell back to Earth — not fast enough', 20, 28); }
  else if(S.escaped){ sctx.fillStyle=cssv('--green'); sctx.fillText('🚀 escaped Earth\u2019s gravity!', 20, 28); }
  else if(S.body){ sctx.fillStyle=cssv('--cyan'); sctx.fillText('in flight — '+(S.mode==='cannonball'?'faster = flatter = farther':'orbiting'), 20, 28); }
  else { sctx.fillStyle=cssv('--text3'); sctx.fillText('press Launch to fire', 20, 28); }
}

function addSlider(parent,{label,min,max,step,val,fmt,mini,oninput}){
  const c=el('div','ctl'); const row=el('div','param-row'); row.append(el('span',null,label),el('span','param-val',fmt(val)));

function rcell(l,v,s,c){ return '<div class="rcell"><div class="r-label">'+l+'</div><div class="r-value '+(c||'sm')+'">'+v+'</div><div class="r-sub">'+(s||'')+'</div></div>'; }
function updateReadout(){

    html=rcell('Range','R = '+n(range(),1)+' m','how far','gold')

    law='<b>R = v₀²·sin(2θ)/g</b> &nbsp; '+opt+' Notice vₓ never changes — gravity only pulls on the vertical motion.';

  }
  else if(S.mode==='orbit'){
    const altKm=S.oAlt*2500, r=R_EARTH+altKm*1000, vc=Math.sqrt(G_EARTH*M_EARTH/r), per=2*Math.PI*r/vc/60;
    html=rcell('Altitude', n(altKm,0)+' km','above surface','gold')

  }

function launch(){
  if(S.mode==='launch'||S.mode==='examples'){ S.flying=true; S.t=0; S.trail=[]; }
  else { resetBody(); }
}
function bindUI(){
  stage=$('stage'); sctx=stage.getContext('2d'); fitCanvas(); window.addEventListener('resize',fitCanvas);
  $('fire-btn').onclick=launch; $('replay-btn').onclick=launch;
  // drag to aim (projectile modes)
  let dragging=false, originPx=null;
  function pt(e){ const r=stage.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX), cy=(e.touches?e.touches[0].clientY:e.clientY); return {x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height)}; }
  function down(e){ if(S.mode!=='launch')return; dragging=true; originPx={x:42, y:H-34}; move(e); e.preventDefault&&e.preventDefault(); }
  function move(e){ if(!dragging)return; const p=pt(e); const dx=p.x-originPx.x, dy=originPx.y-p.y;
    let ang=Math.atan2(dy,dx)*180/Math.PI; ang=Math.max(0,Math.min(90,ang));
    let sp=Math.min(60,Math.max(2, Math.hypot(dx,dy)*0.16));
    aim={angle:ang,speed:sp}; e.preventDefault&&e.preventDefault(); }
  function up(){ if(!dragging)return; dragging=false; if(aim){ S.angle=Math.round(aim.angle); S.v0=Math.round(aim.speed); aim=null; buildControls(); buildWorksheet(); updateReadout(); launch(); } }
  stage.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  stage.addEventListener('touchstart',down,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
  // theme + voice
  const ts=$('theme-switcher'); try{ if(localStorage.getItem('theme')==='light') document.body.classList.add('light-theme'); }catch(e){}
  ts.onclick=()=>{ document.body.classList.toggle('light-theme'); try{localStorage.setItem('theme',document.body.classList.contains('light-theme')?'light':'dark');}catch(e){} };
  const vs=$('voice-switcher'); try{ if(localStorage.getItem('pj-voice')==='on')voiceOn=true; }catch(e){}
  updateVoiceBtn(); vs.onclick=()=>{ voiceOn=!voiceOn; try{localStorage.setItem('pj-voice',voiceOn?'on':'off');}catch(e){} updateVoiceBtn(); if(voiceOn)speak(SCRIPT[S.mode]); else stopSpeech(); };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden)stopSpeech(); });
}
function fitCanvas(){ W=560;H=400; stage.width=W;stage.height=H; }

// ============================================================================
// THEORY
// ============================================================================
function buildTheory(){
  $('theory').innerHTML=`
  <div class="theory-hdr">Theory — Projectile &amp; Orbital Motion</div>
  <h3>One Motion, Two Directions</h3>
  <p>The single most useful idea in projectile motion: the sideways motion and the up-down motion are <em>completely independent</em>. Gravity pulls only downward, so it never touches the horizontal speed. Solve the two directions separately, then put the answers together. That is the whole trick.</p>
  <div class="hbox hb-cyan">
    <strong>Horizontal:</strong> steady speed, no force. &nbsp; x = vₓ·t<br>
    <strong>Vertical:</strong> constant pull of gravity. &nbsp; y = v_y·t − ½g·t²
  </div>

  <h3>The Four Numbers You Usually Want</h3>
  <p>Split the launch speed first: <strong>vₓ = v₀·cos θ</strong> (sideways) and <strong>v_y = v₀·sin θ</strong> (upward). Then everything follows:</p>
  <div class="eq">Time of flight &nbsp; T = 2·v_y / g
    <div class="vars">(level ground) — time to go up and come back. From a height h, use T = (v_y + √(v_y² + 2gh)) / g.</div>
  </div>
  <div class="eq">Maximum height &nbsp; H = v_y² / (2g)
    <div class="vars">At the very top the upward speed is zero for an instant.</div>
  </div>
  <div class="eq">Range &nbsp; R = vₓ · T = v₀²·sin(2θ) / g
    <div class="vars">On level ground this is largest at θ = 45°, where sin(2θ) = 1. Equal angles either side of 45° (say 30° and 60°) give the <em>same</em> range.</div>
  </div>

  <h3>A Worked Example, Start to Finish</h3>
  <p>Kick a ball at v₀ = 20 m/s and θ = 45° (take g = 9.8):</p>
  <table class="ctable">
    <tr><th>Step</th><th>Formula</th><th>Numbers</th><th>Answer</th></tr>
    <tr><td>Components</td><td>v₀cosθ, v₀sinθ</td><td>20×0.707</td><td>vₓ = v_y = 14.1 m/s</td></tr>
    <tr><td>Time</td><td>2v_y/g</td><td>2×14.1/9.8</td><td>T = 2.9 s</td></tr>
    <tr><td>Height</td><td>v_y²/2g</td><td>14.1²/19.6</td><td>H = 10.2 m</td></tr>
    <tr><td>Range</td><td>vₓ·T</td><td>14.1×2.9</td><td>R = 40.8 m</td></tr>
  </table>
  <p>Every example in this simulator uses these same four steps — change the numbers, follow the worksheet, and you can solve any projectile problem.</p>

  <h3>From a Throw to an Orbit</h3>
  <p>Newton asked a brilliant question: what if you threw something <em>really</em> hard? Imagine a cannon on a mountaintop above the air. A slow shot arcs down and lands. A faster shot lands farther because Earth\u2019s surface has started to curve away. Fire fast enough — about <strong>7.9 km/s</strong> — and the ground curves away exactly as fast as the ball falls. It keeps falling and keeps missing: it is now in <em>orbit</em>.</p>
  <div class="eq">Orbital speed &nbsp; v = √(G·M / r) &nbsp;·&nbsp; Escape speed &nbsp; v_esc = √2 · v
    <div class="vars">G = 6.67×10⁻¹¹, M = Earth\u2019s mass, r = distance from Earth\u2019s centre. Higher orbits are slower. At √2 times orbital speed (≈11.2 km/s) the object escapes Earth entirely.</div>
  </div>

  <h3>What We Left Out</h3>
  <p>These clean formulas ignore <em>air resistance</em>, which in real life shortens the range, lowers the best angle below 45°, and makes the path lopsided. They also treat gravity as constant — fine near the ground, but for orbits g weakens with distance, which is why the orbital formulas use the full law of gravitation. The ideas, though, are exactly the ones rocket engineers and ballisticians start from.</p>
  `;
}

// ============================================================================
// LOOP + INIT
// ============================================================================
let rt=0,lastT=0;
function loop(now){
  try{
    if(!lastT)lastT=now; const dt=Math.min(3,(now-lastT)/16.67); lastT=now;
    if(S.flying){ S.t+=dt/60*1.0; const T=flightTime(); const p=posAt(Math.min(S.t,T)); S.trail.push(p); if(S.trail.length>400)S.trail.shift();
      if(S.t>=T){ S.flying=false; S.t=T; } }
    if((S.mode==='cannonball'||S.mode==='orbit')&&S.body) stepGravity(dt);
    drawStage();
    if(rt++%6===0) updateReadout();
  }catch(e){ console.error('loop',e); }
  requestAnimationFrame(loop);
}
function init(){
  buildModeBar(); bindUI(); buildToggles(); buildTheory();
  setMode('launch');
  requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

</script>

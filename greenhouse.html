<script>
'use strict';
// THE GREENHOUSE EFFECT
let W=560,H=400,AUXW=560,AUXH=300;
const SOLAR=1361,SIG=5.670e-8;
function eqTemp(alpha,eps){return Math.pow(SOLAR*(1-alpha)/(4*SIG*(1-eps/2)),0.25);}
// map CO2 ppm -> greenhouse emissivity (log, calibrated so 420ppm≈0.78)
function ppmToEps(ppm){return Math.max(0,Math.min(0.97, 0.758+0.045*Math.log(ppm/280)/Math.log(2)));}

const S={mode:'flow', ppm:420, alpha:0.30, sunOn:true,
  vis:[], ir:[], mols:[], groundHeat:0.4, temp:288,
  molType:'CO2', molPhase:0, hit:0,
  bAlpha:0.30, bEps:0.78, bTemp:288, bSolar:1.0};

let stage,sctx,aux,actx,tNow=0,lastT=0;
function cv(n){return getComputedStyle(document.body).getPropertyValue(n).trim()||'#fff';}
function clr(c,w,h){c.clearRect(0,0,w,h);c.fillStyle=cv('--stage-bg');c.fillRect(0,0,w,h);}

// ---------- FLOW: photons + greenhouse gases ----------
const GROUND_Y=H-46, ATM_TOP=90;
function molCount(){return Math.round(4+ (S.ppm/280)*8);}
function seedMols(){S.mols=[];const n=molCount();for(let i=0;i<n;i++)S.mols.push({x:30+Math.random()*(W-60),y:ATM_TOP+20+Math.random()*(GROUND_Y-ATM_TOP-60),glow:0});}
function spawnVis(){if(!S.sunOn)return;S.vis.push({x:20+Math.random()*40,y:8,vx:1.1+Math.random()*0.5,vy:2.6+Math.random()*0.6});}
function stepFlow(dt){
  // sunlight in
  if(Math.random()<0.35)spawnVis();
  for(let i=S.vis.length-1;i>=0;i--){const p=S.vis[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
    if(p.y>=GROUND_Y){S.vis.splice(i,1);S.groundHeat=Math.min(1,S.groundHeat+0.015);
      // emit IR upward
      S.ir.push({x:p.x,y:GROUND_Y-2,vx:(Math.random()-0.5)*1.2,vy:-2.2-Math.random()*0.5,trapped:false});}
    else if(p.x>W){S.vis.splice(i,1);} }
  // IR photons
  let escaped=0,trapped=0;
  for(let i=S.ir.length-1;i>=0;i--){const p=S.ir[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
    // collide with molecules
    for(const m of S.mols){const dx=p.x-m.x,dy=p.y-m.y;if(dx*dx+dy*dy<160){m.glow=1;
        const ang=Math.random()*6.28;const sp=2.0+Math.random()*0.6;p.vx=Math.cos(ang)*sp;p.vy=Math.sin(ang)*sp;p.trapped=true;
        S.groundHeat=Math.min(1,S.groundHeat+0.006);break;}}
    if(p.y<ATM_TOP-30){S.ir.splice(i,1);escaped++;}
    else if(p.y>GROUND_Y){p.y=GROUND_Y;p.vy=-Math.abs(p.vy);S.groundHeat=Math.min(1,S.groundHeat+0.004);}
    else if(p.x<0||p.x>W){S.ir.splice(i,1);}
  }
  // temperature relaxes toward equilibrium set by ppm
  const eps=ppmToEps(S.ppm);const Teq=eqTemp(S.alpha,eps);
  S.temp+=(Teq-S.temp)*Math.min(1,dt*0.4);
  S.groundHeat+= ( (S.temp-255)/60 - S.groundHeat)*Math.min(1,dt*0.5);
  S.groundHeat=Math.max(0.1,Math.min(1,S.groundHeat));
  for(const m of S.mols)m.glow=Math.max(0,m.glow-dt*3);
}
function drawFlow(){
  // sky gradient by warmth
  const warm=(S.temp-255)/50;
  const sky=sctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#08122a');sky.addColorStop(1,`rgba(${40+warm*90|0},${70+warm*40|0},${140-warm*40|0},0.6)`);
  sctx.fillStyle=sky;sctx.fillRect(0,0,W,GROUND_Y);
  // sun
  const sg=sctx.createRadialGradient(40,20,4,40,20,60);sg.addColorStop(0,'rgba(255,230,120,0.9)');sg.addColorStop(1,'rgba(255,200,60,0)');
  sctx.fillStyle=sg;sctx.beginPath();sctx.arc(40,20,60,0,7);sctx.fill();
  sctx.fillStyle='#ffdd66';sctx.beginPath();sctx.arc(40,20,16,0,7);sctx.fill();
  // atmosphere band
  sctx.fillStyle='rgba(120,180,255,0.05)';sctx.fillRect(0,ATM_TOP,W,GROUND_Y-ATM_TOP);
  sctx.strokeStyle='rgba(150,200,255,0.2)';sctx.setLineDash([4,6]);sctx.beginPath();sctx.moveTo(0,ATM_TOP);sctx.lineTo(W,ATM_TOP);sctx.stroke();sctx.setLineDash([]);
  sctx.fillStyle=cv('--text2');sctx.font='11px monospace';sctx.fillText('space',10,ATM_TOP-8);sctx.fillText('atmosphere',10,ATM_TOP+16);
  // molecules
  for(const m of S.mols){sctx.fillStyle=m.glow>0.1?`rgba(255,${140-80*m.glow|0},80,${0.6+0.4*m.glow})`:'rgba(255,140,80,0.55)';
    sctx.beginPath();sctx.arc(m.x,m.y,5,0,7);sctx.fill();
    sctx.fillStyle='rgba(200,60,60,0.8)';sctx.beginPath();sctx.arc(m.x-7,m.y,3.4,0,7);sctx.arc(m.x+7,m.y,3.4,0,7);sctx.fill();
    if(m.glow>0.3){sctx.strokeStyle=`rgba(255,180,80,${m.glow})`;sctx.lineWidth=1.5;sctx.beginPath();sctx.arc(m.x,m.y,9+4*m.glow,0,7);sctx.stroke();}}
  // photons
  for(const p of S.vis){sctx.strokeStyle='rgba(255,224,90,0.9)';sctx.lineWidth=2.5;sctx.beginPath();sctx.moveTo(p.x,p.y);sctx.lineTo(p.x-p.vx*4,p.y-p.vy*4);sctx.stroke();}
  for(const p of S.ir){sctx.strokeStyle=p.trapped?'rgba(255,90,90,0.95)':'rgba(255,140,70,0.9)';sctx.lineWidth=2.5;sctx.beginPath();sctx.moveTo(p.x,p.y);sctx.lineTo(p.x-p.vx*4,p.y-p.vy*4);sctx.stroke();}
  // ground (warmth color)
  const gh=S.groundHeat;const gg=sctx.createLinearGradient(0,GROUND_Y,0,H);
  gg.addColorStop(0,`rgb(${120+gh*120|0},${100-gh*30|0},${60})`);gg.addColorStop(1,'#3a2a1a');
  sctx.fillStyle=gg;sctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  // heat shimmer
  sctx.strokeStyle=`rgba(255,120,60,${0.2+0.3*gh})`;sctx.lineWidth=1.5;
  for(let x=20;x<W;x+=40){sctx.beginPath();for(let y=0;y<10;y++)sctx.lineTo(x+Math.sin(y*0.8+tNow*0.005)*4,GROUND_Y-y*2);sctx.stroke();}
  // thermometer
  drawThermo(W-40,110,S.temp);
  // legend
  sctx.font='11px monospace';sctx.fillStyle='rgba(255,224,90,1)';sctx.fillText('● sunlight (visible)',14,H-14);
  sctx.fillStyle='rgba(255,110,80,1)';sctx.fillText('● heat (infrared)',180,H-14);
  sctx.fillStyle='rgba(255,140,80,1)';sctx.fillText('● greenhouse gas',330,H-14);
}
function drawThermo(x,y,T){const h=160,tC=T-273.15;const f=Math.max(0,Math.min(1,(T-250)/60));
  sctx.fillStyle='rgba(255,255,255,0.12)';sctx.fillRect(x-6,y,12,h);
  sctx.fillStyle='#ff5a5a';sctx.fillRect(x-4,y+h*(1-f),8,h*f);
  sctx.beginPath();sctx.arc(x,y+h+8,11,0,7);sctx.fillStyle='#ff5a5a';sctx.fill();
  sctx.fillStyle=cv('--text');sctx.font='bold 13px monospace';sctx.textAlign='center';sctx.fillText(tC.toFixed(1)+'°C',x,y-8);sctx.textAlign='left';}

// ---------- MOLECULE ----------
function drawMol(){
  const cx=W/2,cy=H/2-10;const t=tNow*0.006;
  const active=S.molType==='CO2'||S.molType==='H2O'||S.molType==='CH4';
  const amp=(S.hit>0?8*S.hit:0);
  // incoming IR photon periodically
  sctx.strokeStyle='rgba(255,110,80,0.9)';sctx.lineWidth=3;
  const px=((tNow*0.15)%260);
  if(px<200){sctx.beginPath();sctx.moveTo(20+px,cy);sctx.lineTo(20+px-16,cy);sctx.stroke();
    if(20+px>cx-70&&S.hit<=0){S.hit=1;}}
  sctx.font='11px monospace';sctx.fillStyle='rgba(255,110,80,1)';sctx.fillText('infrared photon →',24,cy-40);
  const bend=active?Math.sin(t)*amp:0, str=active?Math.sin(t*1.3)*amp*0.6:0;
  function atom(dx,dy,r,col,lab){sctx.fillStyle=col;sctx.beginPath();sctx.arc(cx+dx,cy+dy,r,0,7);sctx.fill();sctx.fillStyle='#0a0e16';sctx.font='bold 11px monospace';sctx.textAlign='center';sctx.fillText(lab,cx+dx,cy+dy+4);sctx.textAlign='left';}
  function bond(x1,y1,x2,y2){sctx.strokeStyle='rgba(200,220,255,0.5)';sctx.lineWidth=3;sctx.beginPath();sctx.moveTo(cx+x1,cy+y1);sctx.lineTo(cx+x2,cy+y2);sctx.stroke();}
  if(S.molType==='CO2'){bond(-40,bend,0,-bend);bond(0,-bend,40,bend);atom(-40-str,bend,15,'#ff5a5a','O');atom(0,-bend,17,'#888','C');atom(40+str,bend,15,'#ff5a5a','O');}
  else if(S.molType==='N2'){bond(-24,0,24,0);atom(-24,0,17,'#4a9eff','N');atom(24,0,17,'#4a9eff','N');}
  else if(S.molType==='O2'){bond(-24,0,24,0);atom(-24,0,17,'#ff5a5a','O');atom(24,0,17,'#ff5a5a','O');}
  else if(S.molType==='H2O'){bond(-34,20+bend,0,-10);bond(0,-10,34,20+bend);atom(0,-10,16,'#ff5a5a','O');atom(-34,20+bend,11,'#dfe','H');atom(34,20+bend,11,'#dfe','H');}
  else {bond(0,0,-30,-24);bond(0,0,30,-24);bond(0,0,-30,24);bond(0,0,30,24);atom(0,0,16,'#888','C');[[-30,-24],[30,-24],[-30,24],[30,24]].forEach(p=>atom(p[0],p[1]+ (active?Math.sin(t)*amp*0.5:0),10,'#dfe','H'));}
  // verdict
  sctx.textAlign='center';sctx.font='bold 15px monospace';
  sctx.fillStyle=active?cv('--green'):cv('--text2');
  sctx.fillText(active?'✓ absorbs infrared — a greenhouse gas':'✗ transparent to infrared — NOT a greenhouse gas',cx,H-40);
  sctx.font='11px monospace';sctx.fillStyle=cv('--text2');
  sctx.fillText(active?'its bonds bend & stretch, changing the molecule\u2019s charge lopsidedness (dipole)':'symmetric molecule — vibrating keeps it balanced, so it can\u2019t catch IR',cx,H-20);
  sctx.textAlign='left';
  if(S.hit>0)S.hit=Math.max(0,S.hit-0.01);
}

// ---------- BALANCE ----------
function drawBalance(){
  const cx=W/2,cy=170,r=70;
  const inc=SOLAR*S.bSolar/4*(1-S.bAlpha);
  const Ts=eqTemp(S.bAlpha,S.bEps)*Math.pow(S.bSolar,0.25);const out=SIG*Math.pow(Ts,4)*(1-S.bEps/2);
  // planet
  const warm=(Ts-255)/60;
  const pg=sctx.createRadialGradient(cx-20,cy-20,10,cx,cy,r);
  pg.addColorStop(0,`rgb(${60+warm*160|0},${120-warm*40|0},${200-warm*120|0})`);pg.addColorStop(1,'#0a2a4a');
  sctx.fillStyle=pg;sctx.beginPath();sctx.arc(cx,cy,r,0,7);sctx.fill();
  // greenhouse blanket ring
  sctx.strokeStyle=`rgba(255,140,80,${0.2+0.6*S.bEps})`;sctx.lineWidth=6+10*S.bEps;sctx.beginPath();sctx.arc(cx,cy,r+14,0,7);sctx.stroke();
  sctx.fillStyle=cv('--text2');sctx.font='10px monospace';sctx.textAlign='center';sctx.fillText('greenhouse blanket',cx,cy+r+34);sctx.textAlign='left';
  // incoming arrows (yellow) from left-top
  for(let i=0;i<4;i++){const yy=40+i*10;const off=(tNow*0.1+i*30)%120;
    sctx.strokeStyle='rgba(255,224,90,0.9)';sctx.lineWidth=3;sctx.beginPath();sctx.moveTo(cx-160+off,yy);sctx.lineTo(cx-140+off,yy+16);sctx.stroke();}
  sctx.fillStyle='#ffe05a';sctx.font='12px monospace';sctx.fillText('☀ in '+inc.toFixed(0)+' W/m²',30,30);
  // outgoing IR (red) upward right, thinned by greenhouse
  const nOut=Math.max(1,Math.round(4*(1-S.bEps*0.7)));
  for(let i=0;i<nOut;i++){const off=(tNow*0.09+i*40)%120;sctx.strokeStyle='rgba(255,110,80,0.9)';sctx.lineWidth=3;sctx.beginPath();sctx.moveTo(cx+120,cy-40-off);sctx.lineTo(cx+120,cy-20-off);sctx.stroke();}
  sctx.fillStyle='#ff6e50';sctx.fillText('IR out '+out.toFixed(0)+' W/m²',W-170,30);
  // back-radiation arrows (down) — trapped heat
  for(let i=0;i<Math.round(S.bEps*5);i++){const off=(tNow*0.08+i*24)%60;sctx.strokeStyle='rgba(255,150,90,0.5)';sctx.lineWidth=2;sctx.beginPath();sctx.moveTo(cx-40+i*20,cy-r-30+off);sctx.lineTo(cx-40+i*20,cy-r-14+off);sctx.stroke();}
  // temperature dial
  drawThermo(W-36,120,Ts);
  sctx.fillStyle=cv('--text');sctx.font='12px monospace';sctx.textAlign='center';
  sctx.fillText('surface '+(Ts-273.15).toFixed(1)+'°C',cx,cy);
  sctx.textAlign='left';
  const bal=Math.abs(inc-out);
  sctx.fillStyle=bal<3?cv('--green'):cv('--orange');sctx.font='11px monospace';
  sctx.fillText(bal<3?'⚖ energy in ≈ energy out (balanced)':'warming until balance restored…',cx-90,H-16);
}

// ---------- AUX ----------
function drawAux(){if(!actx)return;clr(actx,AUXW,AUXH);({flow:auxFlow,molecule:auxMol,balance:auxBalance}[S.mode])();}
function auxFlow(){actx.fillStyle=cv('--text');actx.font='12px monospace';actx.fillText('CO\u2082 concentration',18,24);
  actx.font='11px monospace';actx.fillStyle=cv('--text2');
  const eps=ppmToEps(S.ppm),Teq=eqTemp(S.alpha,eps)-273.15;
  ['More CO\u2082 → more infrared-catching molecules','→ more heat re-radiated back to the ground','→ the surface settles at a higher temperature.'].forEach((t,i)=>actx.fillText(t,18,52+i*22));
  actx.fillStyle=cv('--gold');actx.font='12px monospace';
  actx.fillText('now: '+S.ppm+' ppm  →  '+Teq.toFixed(1)+'°C',18,140);
  actx.fillStyle=cv('--text2');actx.font='11px monospace';
  actx.fillText('pre-industrial 280 ppm ≈ '+(eqTemp(S.alpha,ppmToEps(280))-273.15).toFixed(1)+'°C',18,168);
  actx.fillText('doubling CO\u2082 warms Earth by roughly 3°C',18,190);}
function auxMol(){actx.fillStyle=cv('--text');actx.font='12px monospace';actx.fillText('Why only some gases trap heat',18,24);
  actx.font='11px monospace';actx.fillStyle=cv('--text2');
  ['A molecule absorbs infrared only if vibrating','changes its electric dipole (its lopsided charge).','','CO\u2082, H\u2082O, CH\u2082O trap heat — their bends & ','asymmetric stretches shift the charge.','','N\u2082 and O\u2082 are symmetric: stretching keeps them','balanced, so infrared passes straight through.','That is why 99% of the air (N\u2082+O\u2082) is NOT','a greenhouse gas.'].forEach((t,i)=>actx.fillText(t,18,50+i*20));}
function auxBalance(){actx.fillStyle=cv('--text');actx.font='12px monospace';actx.fillText('Energy balance  (Stefan–Boltzmann)',18,24);
  const inc=SOLAR*S.bSolar/4*(1-S.bAlpha);const Ts=eqTemp(S.bAlpha,S.bEps)*Math.pow(S.bSolar,0.25);const out=SIG*Math.pow(Ts,4)*(1-S.bEps/2);
  bar(50,inc/340,'#ffe05a','sunlight in',inc.toFixed(0)+' W/m²');
  bar(92,out/340,'#ff6e50','infrared out',out.toFixed(0)+' W/m²');
  actx.fillStyle=cv('--text');actx.font='12px monospace';actx.fillText('surface temperature',18,150);
  actx.fillStyle=cv('--gold');actx.font='14px monospace';actx.fillText((Ts-273.15).toFixed(1)+' °C   ('+Ts.toFixed(0)+' K)',18,174);
  actx.fillStyle=cv('--text2');actx.font='11px monospace';actx.fillText('without any greenhouse gas it would be −18°C',18,200);
  actx.fillText('the 33°C difference is the greenhouse effect',18,220);}
function bar(y,frac,col,lab,val){const x=150,w=AUXW-180;actx.fillStyle=cv('--bg3');actx.fillRect(x,y,w,26);actx.fillStyle=col;actx.globalAlpha=.72;actx.fillRect(x,y,w*Math.max(0,Math.min(1,frac)),26);actx.globalAlpha=1;actx.strokeStyle=col;actx.strokeRect(x,y,w,26);actx.fillStyle=cv('--text');actx.font='12px monospace';actx.fillText(lab,18,y+17);actx.fillStyle=col;actx.fillText(val,x+8,y+17);}

// ---------- UI ----------
function $(i){return document.getElementById(i);}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function sld(p,o){const c=el('div','ctl');const r=el('div','param-row');r.append(el('span',null,o.label),el('span','param-val',o.fmt(o.val)));const inp=el('input');inp.type='range';inp.min=o.min;inp.max=o.max;inp.step=o.step;inp.value=o.val;const m=el('div','sb-mini',o.mini||'');inp.oninput=()=>{r.children[1].textContent=o.fmt(+inp.value);o.oninput(+inp.value);upd();};c.append(r,inp,m);p.appendChild(c);return inp;}
function pick(p,label,opts,cur,fn){const w=el('div');w.style.gridColumn='span 2';w.append(el('div','section-label',label));const g=el('div','btn-grid c'+Math.min(5,opts.length));opts.forEach(o=>{const b=el('button','minibtn'+(o===cur?' active':''),o);b.onclick=()=>{fn(o);buildControls();};g.appendChild(b);});w.appendChild(g);p.appendChild(w);}
function buildControls(){const p=$('mode-controls');p.innerHTML='';
  if(S.mode==='flow'){ sld(p,{label:'🏭 CO\u2082 level',min:280,max:900,step:10,val:S.ppm,fmt:v=>v+' ppm',mini:'more CO\u2082 → warmer',oninput:v=>{S.ppm=v;seedMols();}});
    const w=el('div');w.style.gridColumn='span 2';w.append(el('div','section-label','Jump to'));const g=el('div','btn-grid c3');
    [['🌿 1850 (280)',280],['🏙 today (420)',420],['🔥 high (800)',800]].forEach(([l,v])=>{const b=el('button','minibtn',l);b.onclick=()=>{S.ppm=v;seedMols();buildControls();};g.appendChild(b);});
    w.appendChild(g);p.appendChild(w); }
  else if(S.mode==='molecule'){ pick(p,'Pick a molecule',['CO2','H2O','CH4','N2','O2'],S.molType,o=>{S.molType=o;S.hit=0;}); }
  else { sld(p,{label:'☀ Sunlight',min:0.6,max:1.6,step:0.05,val:S.bSolar,fmt:v=>Math.round(v*100)+'%',mini:'brighter/closer sun',oninput:v=>{S.bSolar=v;}});
    sld(p,{label:'❄ Albedo (reflectivity)',min:0.05,max:0.7,step:0.01,val:S.bAlpha,fmt:v=>Math.round(v*100)+'%',mini:'ice & clouds reflect sunlight',oninput:v=>{S.bAlpha=v;}});
    sld(p,{label:'🌫 Greenhouse strength',min:0,max:0.96,step:0.02,val:S.bEps,fmt:v=>Math.round(v*100)+'%',mini:'0% = airless rock · 100% = thick blanket',oninput:v=>{S.bEps=v;}}); }
  upd();}
function rc(l,v,s,c){return '<div class="rcell"><div class="r-label">'+l+'</div><div class="r-value '+(c||'sm')+'">'+v+'</div><div class="r-sub">'+(s||'')+'</div></div>';}
function upd(){const g=$('readout-grid');let h,law;
  if(S.mode==='flow'){const eps=ppmToEps(S.ppm),Teq=eqTemp(S.alpha,eps)-273.15,rise=Teq-(eqTemp(S.alpha,ppmToEps(280))-273.15);
    h=rc('CO\u2082 level',S.ppm+' ppm','',(S.ppm>500?'red':'gold'))+rc('Temperature',Teq.toFixed(1)+'°C','equilibrium','cyan')+rc('vs 1850',(rise>=0?'+':'')+rise.toFixed(1)+'°C','warming',(rise>1?'red':'green'))+rc('IR trapped',Math.round(eps*100)+'%','by greenhouse gas','violet');
    setB('CO\u2082 '+S.ppm,Teq.toFixed(1)+'°C');
    law='<b>The greenhouse effect:</b> sunlight (visible light) passes through the air and warms the ground. The warm ground glows in <b>infrared</b>. Greenhouse-gas molecules absorb that infrared and re-radiate it in all directions — including back down — trapping heat. More CO\u2082 means more trapping and a warmer surface.';}
  else if(S.mode==='molecule'){const active=['CO2','H2O','CH4'].includes(S.molType);
    h=rc('Molecule',S.molType.replace('2','\u2082'),'','gold')+rc('IR active?',active?'yes':'no','',active?'green':'text2')+rc('Greenhouse gas?',active?'✓':'✗','',active?'green':'red')+rc('Reason',active?'dipole changes':'stays symmetric','when vibrating','violet');
    setB(S.molType,active?'greenhouse':'transparent');
    law='<b>Not every gas traps heat.</b> A molecule can absorb infrared only if its vibrations change its electric dipole. Bent or asymmetric molecules like CO\u2082, water vapour and methane do — so they are greenhouse gases. Symmetric N\u2082 and O\u2082 (99% of the air) do not, so they let infrared pass straight through.';}
  else {const inc=SOLAR*S.bSolar/4*(1-S.bAlpha);const Ts=eqTemp(S.bAlpha,S.bEps)*Math.pow(S.bSolar,0.25);
    h=rc('Sunlight in',inc.toFixed(0)+' W/m²','absorbed','gold')+rc('Surface temp',(Ts-273.15).toFixed(1)+'°C','','cyan')+rc('Greenhouse',Math.round(S.bEps*100)+'%','IR absorbed','violet')+rc('No-GHG temp','−18°C','airless Earth','text2');
    setB((Ts-273.15).toFixed(1)+'°C','ε '+Math.round(S.bEps*100)+'%');
    law='<b>Energy balance:</b> Earth warms until the infrared it radiates to space (σT⁴) balances the sunlight it absorbs. Greenhouse gases block some outgoing infrared, so the surface must get hotter to push enough heat out. Take them away and Earth freezes to −18°C; the real +15°C is the greenhouse gift.';}
  g.innerHTML=h;$('law-strip').innerHTML=law;}
function setB(l,r){$('badge-l').textContent=l;$('badge-r').textContent=r;}
const MODES=[{id:'flow',l:'Energy Flow',t:'trapped heat'},{id:'molecule',l:'The Molecule',t:'why CO\u2082?'},{id:'balance',l:'Energy Balance',t:'planet temp'}];
const TT={flow:'Sunlight In, Heat Trapped',molecule:'Why CO\u2082 Traps Heat',balance:'Planet Energy Balance'};
const HH={flow:'turn up CO\u2082 · watch it warm',molecule:'pick a molecule',balance:'tune the planet'};
let voiceOn=false,tok=0;
const SC={flow:'Watch how the greenhouse effect works. Sunlight streams in as visible light, passes through the air, and warms the ground. The warm ground glows in infrared — invisible heat rays. Greenhouse-gas molecules catch that infrared and fling it back in every direction, some of it back down to the surface. Add more carbon dioxide and more heat is trapped, so the planet warms.',
molecule:'Why does carbon dioxide trap heat when the nitrogen and oxygen that make up most of the air do not? It comes down to symmetry. When carbon dioxide or water vapour vibrates, its charges shift lopsidedly, letting it grab a passing infrared ray. Nitrogen and oxygen are perfectly symmetric, so vibrating keeps them balanced and infrared slips straight through.',
balance:'A planet is a balancing act. It warms until the heat it radiates to space exactly matches the sunlight it soaks up. Greenhouse gases act like a blanket, blocking some of the escaping infrared, so the surface has to run hotter to push enough heat out. Strip them away and Earth would freeze to minus eighteen degrees.'};
function speak(t){if(!voiceOn||!t||typeof speechSynthesis==='undefined')return;const my=++tok;try{speechSynthesis.cancel();}catch(e){}setTimeout(()=>{if(my!==tok||!voiceOn)return;try{const u=new SpeechSynthesisUtterance(t);u.rate=0.96;speechSynthesis.speak(u);}catch(e){}},80);}
function stopV(){tok++;try{if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel();}catch(e){}}
function vBtn(){const v=$('voice-switcher');v.textContent=voiceOn?'🔊 Voice on':'🔇 Voice off';v.style.color=voiceOn?'var(--cyan)':'';}
function modeBar(){const b=$('mode-bar');b.innerHTML='';MODES.forEach(m=>{const t=el('button','mode-tab'+(m.id===S.mode?' active':''),m.l+' <span class="mode-tag">'+m.t+'</span>');t.onclick=()=>setMode(m.id);b.appendChild(t);});}
function setMode(id){stopV();S.mode=id;$('stage-title').firstChild.textContent=TT[id]+' ';$('stage-hint').textContent=HH[id];if(id==='flow'){seedMols();S.vis=[];S.ir=[];}modeBar();buildControls();speak(SC[id]);}
function bindUI(){stage=$('stage');sctx=stage.getContext('2d');aux=$('aux');actx=aux.getContext('2d');fit();window.addEventListener('resize',fit);
  const ts=$('theme-switcher');try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');}catch(e){}
  ts.onclick=()=>{document.body.classList.toggle('light-theme');try{localStorage.setItem('theme',document.body.classList.contains('light-theme')?'light':'dark');}catch(e){}};
  const vs=$('voice-switcher');try{if(localStorage.getItem('gh-voice')==='on')voiceOn=true;}catch(e){}vBtn();
  vs.onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('gh-voice',voiceOn?'on':'off');}catch(e){}vBtn();if(voiceOn)speak(SC[S.mode]);else stopV();};
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopV();});}
function fit(){W=560;H=400;AUXW=560;AUXH=300;stage.width=W;stage.height=H;aux.width=AUXW;aux.height=AUXH;}
function buildTheory(){$('theory').innerHTML=`<div class="theory-hdr">Theory — The Greenhouse Effect</div>
  <h3>Sunlight In, Heat Out</h3><p>The Sun bathes Earth in <em>visible light</em>, which the atmosphere lets through. The ground absorbs it, warms up, and — like any warm object — radiates energy back out. But a cool surface radiates in the <em>infrared</em>, a longer, invisible wavelength.</p>
  <div class="eq">every warm body glows: P = σT⁴<div class="vars">The Sun (5500°C) glows in visible light; Earth\u2019s surface (15°C) glows in infrared. The atmosphere treats the two very differently.</div></div>
  <h3>The Trap</h3><p>Greenhouse gases — carbon dioxide, water vapour, methane — are nearly transparent to incoming sunlight but absorb outgoing infrared. They re-radiate that heat in all directions, sending much of it back down. The surface is warmed twice: once by the Sun, and again by the sky. This is the <strong>greenhouse effect</strong>.</p>
  <div class="hbox hb-gold">Without it, Earth\u2019s average temperature would be about −18°C — frozen. With it, we enjoy +15°C. The greenhouse effect is not the villain; <em>too much</em> of it is.</div>
  <h3>Why Only Some Gases?</h3><p>A gas absorbs infrared only if its molecular vibrations change its electric <em>dipole</em>. Bent molecules (H₂O) and asymmetric stretches (CO₂) do this; the symmetric diatomics N₂ and O₂ do not. That is why the 99% of air that is nitrogen and oxygen plays no greenhouse role, while trace CO₂ matters enormously.</p>
  <h3>Energy Balance &amp; Warming</h3><p>Earth\u2019s temperature settles where absorbed sunlight equals emitted infrared. Add greenhouse gases and you throttle the outgoing side, so the planet must warm until σT⁴ climbs enough to restore balance.</p>
  <div class="eq">σT⁴(1 − ε/2) = S(1−α)/4<div class="vars">S = solar constant, α = albedo (reflectivity), ε = greenhouse absorption. Raising ε (more CO₂) raises the equilibrium temperature T.</div></div>
  <h3>The Human Fingerprint</h3><p>Since 1850, burning fossil fuels has raised CO₂ from about 280 to over 420 parts per million — the highest in millions of years. Doubling CO₂ warms Earth by roughly 3°C, enough to melt ice sheets, raise seas and shift climates. The physics in this lab is exactly why.</p>`;}
let fr=0;
function loop(now){try{if(!lastT)lastT=now;const dt=Math.max(0,Math.min(0.05,(now-lastT)/1000));lastT=now;tNow=now;
  if(S.mode==='flow')stepFlow(dt);
  clr(sctx,W,H);({flow:drawFlow,molecule:drawMol,balance:drawBalance}[S.mode])();
  drawAux();if(fr++%6===0)upd();
 }catch(e){console.error('loop',e);}requestAnimationFrame(loop);}
function init(){modeBar();bindUI();buildTheory();seedMols();setMode('flow');requestAnimationFrame(loop);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

</script></body></html>

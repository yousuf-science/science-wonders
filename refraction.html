<script>
'use strict';
// REFLECTION, REFRACTION, TIR & DISPERSION
let W=560,H=400,AUXW=560,AUXH=300;
const MEDIA={Air:1.0,Water:1.33,Glass:1.5,Diamond:2.42};
const D2R=Math.PI/180,R2D=180/Math.PI;
const S={mode:'reflect',th:45,n1:1.0,n2:1.33,top:'Air',bot:'Water',tirN:'Water',customN:1.33,useCustom:false,prismA:50,drag:false};
function refrAng(n1,n2,th){const s=n1/n2*Math.sin(th*D2R);return s>1?null:Math.asin(s)*R2D;}
function critAng(n1,n2){return n1>n2?Math.asin(n2/n1)*R2D:null;}
function reflectance(n1,n2,th){ // Fresnel (unpolarised) for partial-reflection intensity
  const t1=th*D2R, s=n1/n2*Math.sin(t1); if(s>1)return 1; const t2=Math.asin(s);
  const rs=(n1*Math.cos(t1)-n2*Math.cos(t2))/(n1*Math.cos(t1)+n2*Math.cos(t2));
  const rp=(n1*Math.cos(t2)-n2*Math.cos(t1))/(n1*Math.cos(t2)+n2*Math.cos(t1));
  return Math.min(1,(rs*rs+rp*rp)/2); }

let stage,sctx,aux,actx,tNow=0;
function cv(n){return getComputedStyle(document.body).getPropertyValue(n).trim()||'#fff';}
function clr(c,w,h){c.clearRect(0,0,w,h);c.fillStyle=cv('--stage-bg');c.fillRect(0,0,w,h);}
function drawStage(){if(!sctx)return;clr(sctx,W,H);({reflect:dReflect,snell:dSnell,tir:dTIR,prism:dPrism}[S.mode])();}

// animated light beam: glow + flowing dashes
function beam(x1,y1,x2,y2,col,wid,intensity){const a=intensity==null?1:Math.max(0.15,intensity);
  sctx.strokeStyle=col;sctx.globalAlpha=0.18*a;sctx.lineWidth=(wid||3)+7;sctx.lineCap='round';sctx.beginPath();sctx.moveTo(x1,y1);sctx.lineTo(x2,y2);sctx.stroke();
  sctx.globalAlpha=0.85*a;sctx.lineWidth=wid||3;sctx.beginPath();sctx.moveTo(x1,y1);sctx.lineTo(x2,y2);sctx.stroke();
  sctx.globalAlpha=a;sctx.strokeStyle='#fff';sctx.lineWidth=Math.max(1,(wid||3)-1.5);sctx.setLineDash([7,16]);sctx.lineDashOffset=-(tNow*0.06)%23;sctx.beginPath();sctx.moveTo(x1,y1);sctx.lineTo(x2,y2);sctx.stroke();
  sctx.setLineDash([]);sctx.globalAlpha=1;sctx.lineCap='butt';}
function head(x,y,ang,col){sctx.beginPath();sctx.moveTo(x,y);sctx.lineTo(x-10*Math.cos(ang-0.4),y-10*Math.sin(ang-0.4));sctx.lineTo(x-10*Math.cos(ang+0.4),y-10*Math.sin(ang+0.4));sctx.closePath();sctx.fillStyle=col;sctx.fill();}
function normalLine(ix,iy,len){sctx.strokeStyle=cv('--text3');sctx.setLineDash([5,5]);sctx.lineWidth=1;sctx.beginPath();sctx.moveTo(ix,iy-len);sctx.lineTo(ix,iy+len);sctx.stroke();sctx.setLineDash([]);}
function angleArc(ix,iy,a0,a1,col){sctx.strokeStyle=col;sctx.lineWidth=1;sctx.beginPath();sctx.arc(ix,iy,28,a0,a1);sctx.stroke();}

function dReflect(){const ix=W/2,iy=H/2;
  // mirror surface (hatched)
  sctx.strokeStyle=cv('--border2');sctx.lineWidth=3;sctx.beginPath();sctx.moveTo(0,iy);sctx.lineTo(W,iy);sctx.stroke();
  sctx.strokeStyle=cv('--text3');sctx.lineWidth=1;for(let x=10;x<W;x+=14){sctx.beginPath();sctx.moveTo(x,iy);sctx.lineTo(x-8,iy+9);sctx.stroke();}
  sctx.fillStyle=cv('--text2');sctx.font='10px monospace';sctx.fillText('mirror',W-54,iy+22);
  normalLine(ix,iy,150);
  const th=S.th*D2R,L=170;
  const sx=ix-Math.sin(th)*L, sy=iy-Math.cos(th)*L;
  beam(sx,sy,ix,iy,cv('--gold')); head(ix,iy,Math.atan2(iy-sy,ix-sx),cv('--gold'));
  const rx=ix+Math.sin(th)*L, ry=iy-Math.cos(th)*L;
  beam(ix,iy,rx,ry,cv('--cyan')); head(rx,ry,Math.atan2(ry-iy,rx-ix),cv('--cyan'));
  sctx.fillStyle=cv('--gold');sctx.font='11px monospace';sctx.fillText('incident '+S.th+'°',sx-6,sy-6);
  sctx.fillStyle=cv('--cyan');sctx.fillText('reflected '+S.th+'°',rx-30,ry-6);
  sctx.fillStyle=cv('--text2');sctx.font='12px monospace';sctx.fillText('angle in  =  angle out',ix-66,42);
  sctx.fillStyle=cv('--text3');sctx.font='9px monospace';sctx.fillText('drag the beam to change the angle',ix-90,H-16);}

function dSnell(){const c={Air:'#5fe9c8',Water:'#3a8fff',Glass:'#8ab4ff',Diamond:'#eaf2ff'};const ix=W/2,iy=H/2;
  const n1=S.n1,n2=S.n2;
  sctx.fillStyle=c[S.top]||'#39f';sctx.globalAlpha=.13;sctx.fillRect(0,0,W,iy);sctx.fillStyle=c[S.bot]||'#39f';sctx.fillRect(0,iy,W,H-iy);sctx.globalAlpha=1;
  sctx.strokeStyle=cv('--border2');sctx.lineWidth=2;sctx.beginPath();sctx.moveTo(0,iy);sctx.lineTo(W,iy);sctx.stroke();
  normalLine(ix,iy,150);
  sctx.fillStyle=cv('--text2');sctx.font='10px monospace';sctx.fillText(S.top+'  n='+n1.toFixed(2),16,24);sctx.fillText(S.bot+'  n='+n2.toFixed(2),16,H-14);
  const th=S.th*D2R,L=160;const sx=ix-Math.sin(th)*L,sy=iy-Math.cos(th)*L;
  beam(sx,sy,ix,iy,cv('--gold'));head(ix,iy,Math.atan2(iy-sy,ix-sx),cv('--gold'));
  const t2=refrAng(n1,n2,S.th),Rf=reflectance(n1,n2,S.th);
  // partial reflection
  const rx=ix+Math.sin(th)*L*0.8,ry=iy-Math.cos(th)*L*0.8; beam(ix,iy,rx,ry,cv('--text2'),2,Rf);
  sctx.fillStyle=cv('--text2');sctx.font='9px monospace';sctx.fillText('reflected '+(Rf*100).toFixed(0)+'%',rx-20,ry-4);
  if(t2!==null){const a2=t2*D2R;const tx=ix+Math.sin(a2)*160,ty=iy+Math.cos(a2)*160;beam(ix,iy,tx,ty,cv('--cyan'),3,1-Rf);head(tx,ty,Math.atan2(ty-iy,tx-ix),cv('--cyan'));
    sctx.fillStyle=cv('--cyan');sctx.font='11px monospace';sctx.fillText('refracted '+t2.toFixed(1)+'°',tx+6,ty);}
  else {const tx=ix+Math.sin(th)*160,ty=iy-Math.cos(th)*160;beam(ix,iy,tx,ty,cv('--red'),3);sctx.fillStyle=cv('--red');sctx.font='12px monospace';sctx.fillText('TOTAL INTERNAL REFLECTION',ix-90,iy+40);}
  sctx.fillStyle=cv('--gold');sctx.font='11px monospace';sctx.fillText('incident '+S.th+'°',sx-6,sy-6);
  sctx.fillStyle=cv('--text3');sctx.font='9px monospace';sctx.fillText(n2>n1?'denser below → bends toward normal':'rarer below → bends away',ix-180,iy-10);
  sctx.fillText('drag the beam to aim',ix+30,H-16);}

function dTIR(){const n1=MEDIA[S.tirN];const ix=W/2,iy=148;
  sctx.fillStyle='#3a8fff';sctx.globalAlpha=.13;sctx.fillRect(0,0,W,iy);sctx.fillStyle='#5fe9c8';sctx.globalAlpha=.10;sctx.fillRect(0,iy,W,H-iy);sctx.globalAlpha=1;
  sctx.strokeStyle=cv('--border2');sctx.lineWidth=2;sctx.beginPath();sctx.moveTo(0,iy);sctx.lineTo(W,iy);sctx.stroke();
  sctx.fillStyle=cv('--text2');sctx.font='10px monospace';sctx.fillText(S.tirN+'  n='+n1.toFixed(2),16,24);sctx.fillText('Air  n=1.00',16,iy+18);
  normalLine(ix,iy,120);
  const tc=critAng(n1,1.0);const th=S.th*D2R,L=150;const sx=ix-Math.sin(th)*L,sy=iy+Math.cos(th)*L;
  beam(sx,sy,ix,iy,cv('--gold'));head(ix,iy,Math.atan2(iy-sy,ix-sx),cv('--gold'));
  const t2=refrAng(n1,1.0,S.th),Rf=reflectance(n1,1.0,S.th);
  if(t2!==null){const a2=t2*D2R;const tx=ix+Math.sin(a2)*130,ty=iy-Math.cos(a2)*130;beam(ix,iy,tx,ty,cv('--cyan'),3,1-Rf);head(tx,ty,Math.atan2(ty-iy,tx-ix),cv('--cyan'));
    beam(ix,iy,ix+Math.sin(th)*90,iy+Math.cos(th)*90,cv('--text2'),2,Rf);
    sctx.fillStyle=cv('--cyan');sctx.font='11px monospace';sctx.fillText('escapes '+t2.toFixed(1)+'°',tx+4,ty-2);}
  else {beam(ix,iy,ix+Math.sin(th)*150,iy+Math.cos(th)*150,cv('--red'),3);sctx.fillStyle=cv('--red');sctx.font='12px monospace';sctx.fillText('⚡ trapped — total internal reflection',ix-30,iy+50);}
  if(tc){sctx.strokeStyle=cv('--violet');sctx.setLineDash([3,3]);sctx.lineWidth=1.5;sctx.beginPath();sctx.moveTo(ix,iy);sctx.lineTo(ix-Math.sin(tc*D2R)*130,iy+Math.cos(tc*D2R)*130);sctx.stroke();sctx.setLineDash([]);sctx.fillStyle=cv('--violet');sctx.font='10px monospace';sctx.fillText('critical '+tc.toFixed(1)+'°',ix-118,iy+60);}
  // fibre-optic demo at the bottom
  const fy=H-44,fx0=30,fx1=W-30,r=15;
  sctx.strokeStyle=cv('--border2');sctx.lineWidth=2;sctx.strokeRect(fx0,fy-r,fx1-fx0,2*r);
  sctx.fillStyle=cv('--text3');sctx.font='9px monospace';sctx.fillText('fibre-optic cable: light zig-zags by TIR and never leaks out',fx0+6,fy-r-6);
  sctx.strokeStyle=cv('--cyan');sctx.lineWidth=2;sctx.beginPath();let zx=fx0,zy=fy+r,up=true;sctx.moveTo(zx,zy);
  const seg=44;while(zx<fx1){zx+=seg;zy=up?fy-r:fy+r;sctx.lineTo(Math.min(zx,fx1),zy);up=!up;}sctx.stroke();
  // moving photon
  const pp=((tNow*0.12)%(fx1-fx0))+fx0;const period=seg;const ph=((pp-fx0)%period)/period;const py=(Math.floor((pp-fx0)/period)%2===0)?(fy+r-ph*2*r):(fy-r+ph*2*r);
  sctx.fillStyle='#fff';sctx.beginPath();sctx.arc(pp,py,4,0,7);sctx.fill();sctx.fillStyle=cv('--cyan');sctx.globalAlpha=.5;sctx.beginPath();sctx.arc(pp,py,7,0,7);sctx.fill();sctx.globalAlpha=1;}

function dPrism(){const cx=W/2,cy=H/2+10,sz=90;
  const ax=cx,ay=cy-sz,bx=cx-sz*0.9,by=cy+sz*0.6,dx2=cx+sz*0.9,dy2=cy+sz*0.6;
  sctx.fillStyle='#5a7';sctx.globalAlpha=.10;sctx.beginPath();sctx.moveTo(ax,ay);sctx.lineTo(bx,by);sctx.lineTo(dx2,dy2);sctx.closePath();sctx.fill();sctx.globalAlpha=1;
  sctx.strokeStyle=cv('--border2');sctx.lineWidth=2;sctx.stroke();
  // entry point on left face, white beam in
  const e={x:(ax+bx)/2+ (S.prismA-50)*0.4, y:(ay+by)/2};
  const inAng=(S.prismA-50)*0.5*D2R; // tweak incoming angle
  const sx=e.x-150, sy=e.y-150*Math.tan(0.25+inAng);
  beam(sx,sy,e.x,e.y,'#fff',4);
  // internal beam to exit on right face
  const xpt={x:(ax+dx2)/2,y:(ay+dy2)/2};
  beam(e.x,e.y,xpt.x,xpt.y,'#dfe',3);
  // dispersed output fan — violet bends most
  const cols=[['#ff3030',0],['#ff9020',0.6],['#ffe020',1.1],['#40ff60',1.7],['#40a0ff',2.3],['#9040ff',3.0]];
  const base=0.55+(S.prismA-50)*0.004;
  cols.forEach(([col,dev])=>{const a=base+dev*0.045;const ex=xpt.x+Math.cos(a)*170,ey=xpt.y+Math.sin(a)*170;beam(xpt.x,xpt.y,ex,ey,col,2.4);});
  sctx.fillStyle=cv('--text2');sctx.font='11px monospace';sctx.fillText('white light',sx,sy-6);
  sctx.fillStyle=cv('--text2');sctx.fillText('rainbow',xpt.x+120,xpt.y+70);
  sctx.fillStyle=cv('--text3');sctx.font='9px monospace';sctx.fillText('each colour has a slightly different n → bends by a different amount',30,H-16);
  sctx.fillStyle='#ff3030';sctx.fillText('red bends least',xpt.x+120,xpt.y+30);sctx.fillStyle='#9040ff';sctx.fillText('violet bends most',xpt.x+120,xpt.y+90);}

function drawAux(){if(!actx)return;clr(actx,AUXW,AUXH);
  if(S.mode==='reflect'){actx.fillStyle=cv('--text2');actx.font='12px monospace';actx.fillText('Law of Reflection',20,30);
    actx.font='13px monospace';actx.fillStyle=cv('--gold');actx.fillText('θ_incidence = θ_reflection = '+S.th+'°',20,64);
    actx.fillStyle=cv('--text3');actx.font='11px monospace';
    ['The incident ray, the reflected ray and the','normal all lie in one plane.','','A smooth surface reflects a clear image (specular);','a rough one scatters light every way (diffuse) —','which is why you see a mirror but not a wall.'].forEach((t,i)=>actx.fillText(t,20,96+i*22));return;}
  if(S.mode==='prism'){actx.fillStyle=cv('--text2');actx.font='12px monospace';actx.fillText('Dispersion',20,28);
    actx.font='11px monospace';actx.fillStyle=cv('--text3');
    ['A material\u2019s refractive index depends slightly','on the colour (wavelength) of light.','Violet light slows most, so it bends most;','red slows least and bends least.','','So a single refraction fans white light into a','spectrum — a prism, and a raindrop, make rainbows.'].forEach((t,i)=>actx.fillText(t,20,56+i*22));
    actx.fillStyle=cv('--gold');actx.font='11px monospace';actx.fillText('glass: n(red)≈1.513   n(violet)≈1.532',20,AUXH-14);return;}
  // snell / tir
  actx.fillStyle=cv('--text3');actx.font='10px monospace';actx.fillText("Snell's law:  n₁·sinθ₁ = n₂·sinθ₂",20,24);
  const n1=S.mode==='snell'?S.n1:MEDIA[S.tirN],n2=S.mode==='snell'?S.n2:1.0;
  actx.font='12px monospace';actx.fillStyle=cv('--gold');actx.fillText(n1.toFixed(2)+' × sin('+S.th+'°) = '+(n1*Math.sin(S.th*D2R)).toFixed(3),20,54);
  const t2=refrAng(n1,n2,S.th);actx.fillStyle=cv('--cyan');actx.fillText(t2!==null?(n2.toFixed(2)+' × sin('+t2.toFixed(1)+'°) = '+(n2*Math.sin(t2*D2R)).toFixed(3)+' ✓'):'no real solution → all light reflects',20,82);
  const tc=critAng(n1,n2);
  if(tc){actx.fillStyle=cv('--violet');actx.fillText('critical angle = asin(n₂/n₁) = '+tc.toFixed(1)+'°',20,118);actx.fillStyle=cv('--text2');actx.font='11px monospace';actx.fillText(S.th>tc?'beyond critical → trapped (fibre optics)':'below critical → some light escapes',20,146);}
  else {actx.fillStyle=cv('--text2');actx.font='11px monospace';actx.fillText('into a denser medium — light always gets through',20,118);}
  actx.fillStyle=cv('--text2');actx.font='10px monospace';actx.fillText('reflected fraction (Fresnel): '+(reflectance(n1,n2,S.th)*100).toFixed(0)+'%  — grows near grazing & critical',20,AUXH-12);}

function $(i){return document.getElementById(i);}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function sld(p,o){const c=el('div','ctl');const r=el('div','param-row');r.append(el('span',null,o.label),el('span','param-val',o.fmt(o.val)));const inp=el('input');inp.type='range';inp.min=o.min;inp.max=o.max;inp.step=o.step;inp.value=o.val;const m=el('div','sb-mini',o.mini||'');inp.oninput=()=>{r.children[1].textContent=o.fmt(+inp.value);o.oninput(+inp.value);upd();};c.append(r,inp,m);p.appendChild(c);return inp;}
function pick(p,label,opts,cur,fn){const w=el('div');w.style.gridColumn='span 2';w.append(el('div','section-label',label));const g=el('div','btn-grid c'+opts.length);opts.forEach(o=>{const b=el('button','minibtn'+(o===cur?' active':''),o);b.onclick=()=>{fn(o);buildControls();};g.appendChild(b);});w.appendChild(g);p.appendChild(w);}
function buildControls(){const p=$('mode-controls');p.innerHTML='';
  if(S.mode==='reflect'){ sld(p,{label:'Angle of incidence',min:0,max:88,step:1,val:S.th,fmt:v=>v+'°',mini:'or drag the beam on the mirror',oninput:v=>{S.th=v;}}); }
  else if(S.mode==='snell'){ sld(p,{label:'Angle of incidence',min:0,max:89,step:1,val:S.th,fmt:v=>v+'°',mini:'or drag the beam',oninput:v=>{S.th=v;}});
    pick(p,'Top medium',Object.keys(MEDIA),S.top,o=>{S.top=o;S.n1=MEDIA[o];});
    pick(p,'Bottom medium',Object.keys(MEDIA),S.bot,o=>{S.bot=o;S.n2=MEDIA[o];});
    const w=el('div');w.style.gridColumn='span 2';const b=el('button','minibtn','⇅ Swap media');b.onclick=()=>{const t=S.top;S.top=S.bot;S.bot=t;const n=S.n1;S.n1=S.n2;S.n2=n;buildControls();};w.appendChild(b);p.appendChild(w); }
  else if(S.mode==='tir'){ sld(p,{label:'Angle of incidence',min:0,max:89,step:1,val:S.th,fmt:v=>v+'°',mini:'push past the critical angle',oninput:v=>{S.th=v;}});
    pick(p,'Dense medium (→ air)',['Water','Glass','Diamond'],S.tirN,o=>{S.tirN=o;}); }
  else { sld(p,{label:'Beam position / angle',min:0,max:100,step:1,val:S.prismA,fmt:v=>v+'',mini:'slide to steer the white beam',oninput:v=>{S.prismA=v;}}); }
  upd();}
function rc(l,v,s,c){return '<div class="rcell"><div class="r-label">'+l+'</div><div class="r-value '+(c||'sm')+'">'+v+'</div><div class="r-sub">'+(s||'')+'</div></div>';}
function upd(){const g=$('readout-grid');let h,law;
  if(S.mode==='reflect'){h=rc('Incidence',S.th+'°','','gold')+rc('Reflection',S.th+'°','equal & opposite','cyan')+rc('Rule','θᵢ = θᵣ','law of reflection','green')+rc('Surface','mirror','specular','violet');
    setB('θ '+S.th+'°','θᵢ=θᵣ');law='<b>Law of reflection:</b> a ray bounces off a surface at exactly the angle it arrived, measured from the normal — angle in equals angle out, both in the same plane. A smooth surface gives a sharp mirror image; a rough one scatters the light (diffuse reflection), which is how you see ordinary objects.';}
  else if(S.mode==='prism'){h=rc('Effect','dispersion','white → rainbow','gold')+rc('Bends most','violet','highest n','violet')+rc('Bends least','red','lowest n','red')+rc('Cause','n varies','with wavelength','cyan');
    setB('prism','rainbow');law='<b>Dispersion:</b> the refractive index is slightly larger for violet light than for red, so when white light refracts the colours bend by different amounts and fan out into a spectrum. A glass prism — and a million raindrops — turn sunlight into a rainbow this way.';}
  else {const n1=S.mode==='snell'?S.n1:MEDIA[S.tirN],n2=S.mode==='snell'?S.n2:1.0;const t2=refrAng(n1,n2,S.th),tc=critAng(n1,n2),Rf=reflectance(n1,n2,S.th);
    h=rc('Incidence',S.th+'°','','gold')+rc('Refraction',t2!==null?t2.toFixed(1)+'°':'— none','',t2!==null?'cyan':'red')+rc('Reflected',(Rf*100).toFixed(0)+'%','Fresnel','violet')+rc('Critical',tc?tc.toFixed(1)+'°':'n/a','',t2===null?'red':'sm');
    setB('θ '+S.th+'°',t2!==null?'refracts':'TIR');
    law='<b>n₁·sinθ₁ = n₂·sinθ₂.</b> Light slows in a denser medium and bends toward the normal; part of it always reflects too. Going dense→rare, past the <b>critical angle</b> none escapes — total internal reflection, the basis of fibre optics and a diamond\u2019s fire.';}
  g.innerHTML=h;$('law-strip').innerHTML=law;}
function setB(l,r){$('badge-l').textContent=l;$('badge-r').textContent=r;}
const MODES=[{id:'reflect',l:'Reflection',t:'mirror'},{id:'snell',l:"Refraction",t:"Snell's law"},{id:'tir',l:'Total Internal Reflection',t:'fibre optics'},{id:'prism',l:'Prism',t:'rainbow'}];
const TT={reflect:'Reflection',snell:'Refraction',tir:'Total Internal Reflection',prism:'Prism & Dispersion'};
const HH={reflect:'drag the beam on the mirror',snell:'change the angle & media',tir:'pass the critical angle',prism:'steer white light through glass'};
let voiceOn=false,tok=0;
const SC={reflect:'When light hits a smooth surface it bounces off at exactly the same angle it came in, measured from the line called the normal. Angle in equals angle out — that is the whole law of reflection. A polished surface gives a crisp mirror image, while a rough one scatters the light in all directions, which is how you see everything around you.',
snell:'When light crosses from one material into another it changes speed and bends. Into something denser it slows and bends toward the normal; the exact amount is Snell\u2019s law. And notice some light always reflects back too — more and more of it as the angle gets steep.',
tir:'Send light from glass or water toward air at a steep enough angle and it cannot escape at all — it reflects entirely back inside. That total internal reflection is what pipes light along a fibre-optic cable, bouncing thousands of times without leaking, and what makes a cut diamond blaze with trapped light.',
prism:'A prism splits white light into a rainbow because the glass bends each colour by a slightly different amount. Violet light is slowed the most and bends the most, red the least, so the colours fan apart. The very same effect in countless raindrops paints a rainbow across the sky.'};
function speak(t){if(!voiceOn||!t||typeof speechSynthesis==='undefined')return;const my=++tok;try{speechSynthesis.cancel();}catch(e){}setTimeout(()=>{if(my!==tok||!voiceOn)return;try{const u=new SpeechSynthesisUtterance(t);u.rate=0.97;speechSynthesis.speak(u);}catch(e){}},80);}
function stopV(){tok++;try{if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel();}catch(e){}}
function vBtn(){const v=$('voice-switcher');v.textContent=voiceOn?'🔊 Voice on':'🔇 Voice off';v.style.color=voiceOn?'var(--cyan)':'';}
function modeBar(){const b=$('mode-bar');b.innerHTML='';MODES.forEach(m=>{const t=el('button','mode-tab'+(m.id===S.mode?' active':''),m.l+' <span class="mode-tag">'+m.t+'</span>');t.onclick=()=>setMode(m.id);b.appendChild(t);});}
function setMode(id){stopV();S.mode=id;$('stage-title').firstChild.textContent=TT[id]+' ';$('stage-hint').textContent=HH[id];if(id==='tir')S.th=55;else if(id==='reflect')S.th=45;else if(id==='snell')S.th=40;modeBar();buildControls();speak(SC[id]);}
function dragAngle(mx,my){const ix=W/2,iy=(S.mode==='tir')?148:H/2;const dx=mx-ix,dy=my-iy;
  if(S.mode==='tir'){ if(dy<=2)return; S.th=Math.max(0,Math.min(89,Math.atan2(Math.abs(dx),dy)*R2D)); }
  else { if(dy>=-2)return; S.th=Math.max(0,Math.min(S.mode==='reflect'?88:89,Math.atan2(Math.abs(dx),-dy)*R2D)); }
  buildControls();}
function bindUI(){stage=$('stage');sctx=stage.getContext('2d');aux=$('aux');actx=aux.getContext('2d');fit();window.addEventListener('resize',fit);
  function pt(e){const r=stage.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX),cy=(e.touches?e.touches[0].clientY:e.clientY);return{x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};}
  function dn(e){if(S.mode==='prism')return;S.drag=true;const p=pt(e);dragAngle(p.x,p.y);e.preventDefault&&e.preventDefault();}
  function mv(e){if(!S.drag)return;const p=pt(e);dragAngle(p.x,p.y);e.preventDefault&&e.preventDefault();}
  function up(){S.drag=false;}
  stage.addEventListener('mousedown',dn);window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
  stage.addEventListener('touchstart',dn,{passive:false});window.addEventListener('touchmove',mv,{passive:false});window.addEventListener('touchend',up);
  const ts=$('theme-switcher');try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');}catch(e){}
  ts.onclick=()=>{document.body.classList.toggle('light-theme');try{localStorage.setItem('theme',document.body.classList.contains('light-theme')?'light':'dark');}catch(e){}};
  const vs=$('voice-switcher');try{if(localStorage.getItem('refr-voice')==='on')voiceOn=true;}catch(e){}vBtn();
  vs.onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('refr-voice',voiceOn?'on':'off');}catch(e){}vBtn();if(voiceOn)speak(SC[S.mode]);else stopV();};
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopV();});}
function fit(){W=560;H=400;AUXW=560;AUXH=300;stage.width=W;stage.height=H;aux.width=AUXW;aux.height=AUXH;}
function buildTheory(){$('theory').innerHTML=`<div class="theory-hdr">Theory — Reflection, Refraction &amp; Dispersion</div>
  <h3>Reflection</h3><p>Light striking a surface bounces off at the same angle it arrived, both measured from the <em>normal</em> (the perpendicular). Smooth surfaces reflect a clear image; rough ones scatter light, letting us see everyday objects.</p>
  <div class="eq">θ_incidence = θ_reflection</div>
  <h3>Refraction — Why Light Bends</h3><p>Light travels slower in an optically denser material. The <em>refractive index</em> n = c/v measures how much. Crossing a boundary at an angle, the wave pivots — bending toward the normal going into a denser medium, away from it going into a rarer one.</p>
  <div class="eq">n₁·sinθ₁ = n₂·sinθ₂<div class="vars">Some light always reflects too (the Fresnel fraction), growing as the angle approaches grazing or the critical angle.</div></div>
  <h3>Total Internal Reflection</h3><p>Going dense→rare, steepen the angle and the refracted ray bends ever further from the normal — until at the <em>critical angle</em> it vanishes and all the light reflects back inside.</p>
  <div class="eq">θ_c = sin⁻¹(n₂ / n₁)<div class="vars">Water→air 48.8°, glass→air 41.8°, diamond→air just 24.4°. Fibre-optic cables carry data as light trapped this way.</div></div>
  <h3>Dispersion &amp; Rainbows</h3><p>A material\u2019s index is slightly higher for violet light than red, so colours refract by different amounts. White light passing through a prism — or a raindrop — fans into a spectrum, painting a rainbow.</p>`;}
let fr=0;function loop(now){try{tNow=now;drawStage();drawAux();if(fr++%6===0)upd();}catch(e){console.error(e);}requestAnimationFrame(loop);}
function init(){modeBar();bindUI();buildTheory();setMode('reflect');requestAnimationFrame(loop);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

</script></body></html>
